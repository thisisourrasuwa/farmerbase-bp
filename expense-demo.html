<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Expenses (5-Year)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:system-ui;background:#f4f7f6;margin:0}
.container{max-width:1600px;margin:20px auto;background:#fff;padding:24px;border-radius:12px}
h1{color:#2e7d32;margin-top:0}

table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}

input{width:90px;padding:6px}
.lock{background:#f1f8e9;font-weight:600}

/* PAGE FLOW */
.page-follow{
 position:fixed;right:14px;top:50%;
 transform:translateY(-50%);
 display:flex;flex-direction:column;gap:12px;z-index:999
}
.pf-btn{
 width:46px;height:46px;border-radius:50%;
 background:#2e7d32;color:#fff;
 display:flex;align-items:center;justify-content:center;
 text-decoration:none;font-size:22px
}
</style>
</head>

<body>

<div class="container">
<h1>💸 खर्च विवरण (५ वर्ष)</h1>

<p>
✔️ Breeding Engine बाट संख्या<br>
✔️ Feed / Vitamin / Medicine छुट्टाछुट्टै<br>
✔️ ९–१२ र बयस्क स्पष्ट
</p>

<h2>🍽️ दर (Editable)</h2>
<table>
<tr><th>प्रकार</th><th>दर</th><th>एकाइ</th></tr>
<tr><td>Feed (9–12)</td><td><input id="f912" value="3"></td><td>kg / दिन</td></tr>
<tr><td>Feed (Adult)</td><td><input id="fadult" value="3"></td><td>kg / दिन</td></tr>
<tr><td>Vitamin</td><td><input id="vit" value="800"></td><td>Rs / वर्ष</td></tr>
<tr><td>Medicine</td><td><input id="med" value="600"></td><td>Rs / वर्ष</td></tr>
</table>

<button onclick="render()">🔄 Recalculate</button>

<hr>
<h2>📊 ५ वर्षे खर्च (Rs)</h2>
<div id="result"></div>

</div>

<!-- PAGE FLOW -->
<div class="page-follow">
 <a href="production.html" class="pf-btn">⬅️</a>
 <a href="capital-source.html" class="pf-btn">➡️</a>
</div>

<script>
// ================= LOAD BREEDING DATA =================
const breeding =
 JSON.parse(localStorage.getItem("BREEDING_ENGINE_5YR_RESULT")) || [];

function v(id){return Number(document.getElementById(id).value)||0;}

function render(){
 if(!breeding.length){
  document.getElementById("result").innerHTML =
   "<p>पहिला animal-breeding-engine.html मा Run Engine गर्नुहोस्।</p>";
  return;
 }

 let html=`<table>
 <tr>
  <th rowspan="2">वर्ष</th>
  <th colspan="4">Feed खर्च</th>
  <th rowspan="2">Vitamin</th>
  <th rowspan="2">Medicine</th>
  <th rowspan="2">कुल</th>
 </tr>
 <tr>
  <th>९–१२ भाले</th>
  <th>९–१२ पोथी</th>
  <th>बयस्क भाले</th>
  <th>माउ</th>
 </tr>`;

 breeding.forEach(y=>{
  const f9M = y.sold9M * v("f912") * 365;
  const f9F = y.sold9F * v("f912") * 365;
  const fAM = y.stockMale * v("fadult") * 365;
  const fAF = y.stockFemale * v("fadult") * 365;

  const totalAnimals =
    y.sold9M + y.sold9F + y.stockMale + y.stockFemale;

  const vit = totalAnimals * v("vit");
  const med = totalAnimals * v("med");

  const total = f9M + f9F + fAM + fAF + vit + med;

  html+=`
  <tr>
   <td>Year ${y.year}</td>
   <td>${Math.round(f9M)}</td>
   <td>${Math.round(f9F)}</td>
   <td>${Math.round(fAM)}</td>
   <td>${Math.round(fAF)}</td>
   <td>${Math.round(vit)}</td>
   <td>${Math.round(med)}</td>
   <td><b>${Math.round(total)}</b></td>
  </tr>`;
 });

 html+=`</table>`;
 document.getElementById("result").innerHTML = html;
}

render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Feed • Vitamin • Medicine (5 Years)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:"Noto Sans Devanagari","Kalimati",system-ui;background:#f4f7f6;margin:0}
.container{max-width:1800px;margin:20px auto;background:#fff;padding:24px;border-radius:12px}
h1{color:#2e7d32;margin-top:0}
table{width:100%;border-collapse:collapse;margin-top:16px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}
input{width:80px}
button{padding:10px 18px;background:#2e7d32;color:#fff;border:none;border-radius:6px;cursor:pointer}
.note{background:#f9fff6;border:1px dashed #9ccc65;padding:10px;margin-bottom:14px}
</style>
</head>

<body>
<div class="container">

<h1>🍽 Feed • Vitamin • Medicine (५ वर्ष)</h1>

<div class="note">
✔ उमेर/लिङ्ग अनुसार खर्च<br>
✔ ५ वर्षे auto calculation<br>
✔ Expenses page का लागि data save हुन्छ
</div>

<h2>📌 वार्षिक खर्च दर (Rs / जनावर)</h2>

<table>
<tr>
<th>Category</th><th>Feed</th><th>Vitamin</th><th>Medicine</th>
</tr>
<tr><td>९–१२ भाले</td><td><input id="f_m12" value="4500"></td><td><input id="v_m12" value="320"></td><td><input id="m_m12" value="400"></td></tr>
<tr><td>९–१२ पोथी</td><td><input id="f_f12" value="4200"></td><td><input id="v_f12" value="350"></td><td><input id="m_f12" value="420"></td></tr>
<tr><td>बयस्क भाले</td><td><input id="f_am" value="6200"></td><td><input id="v_am" value="500"></td><td><input id="m_am" value="650"></td></tr>
<tr><td>बयस्क माउ</td><td><input id="f_af" value="6800"></td><td><input id="v_af" value="550"></td><td><input id="m_af" value="700"></td></tr>
</table>

<br>
<button onclick="run()">🔄 Run & Save (5 Years)</button>

<hr>
<h2>📊 ५ वर्षे Summary</h2>
<div id="result"></div>

</div>

<script>
function n(id){return Number(document.getElementById(id).value)||0;}

function run(){

  // DEMO population growth (stable logic)
  const base = [
    {m12:80,f12:70,am:10,af:20},
    {m12:140,f12:120,am:18,af:35},
    {m12:220,f12:190,am:25,af:60},
    {m12:350,f12:300,am:40,af:90},
    {m12:520,f12:470,am:60,af:140}
  ];

  let out=[];

  base.forEach((p,i)=>{
    const feed = {
      m12:p.m12*n("f_m12"),
      f12:p.f12*n("f_f12"),
      adm:p.am*n("f_am"),
      adf:p.af*n("f_af")
    };
    feed.total = feed.m12+feed.f12+feed.adm+feed.adf;

    const vit = {
      m12:p.m12*n("v_m12"),
      f12:p.f12*n("v_f12"),
      adm:p.am*n("v_am"),
      adf:p.af*n("v_af")
    };
    vit.total = vit.m12+vit.f12+vit.adm+vit.adf;

    const med = {
      m12:p.m12*n("m_m12"),
      f12:p.f12*n("m_f12"),
      adm:p.am*n("m_am"),
      adf:p.af*n("m_af")
    };
    med.total = med.m12+med.f12+med.adm+med.adf;

    out.push({
      year:i+1,
      feed,vit,med
    });
  });

  localStorage.setItem("FEED_COST_BREAKDOWN_5YR", JSON.stringify(out));
  render(out);
}

function render(d){
  let h=`<table>
  <tr><th>वर्ष</th><th>Feed</th><th>Vitamin</th><th>Medicine</th><th>कुल</th></tr>`;
  d.forEach(x=>{
    h+=`<tr>
      <td>${x.year}</td>
      <td>${x.feed.total}</td>
      <td>${x.vit.total}</td>
      <td>${x.med.total}</td>
      <td><b>${x.feed.total+x.vit.total+x.med.total}</b></td>
    </tr>`;
  });
  h+=`</table>`;
  result.innerHTML=h;
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Feed • Vitamin • Medicine (5 Years)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:"Noto Sans Devanagari","Kalimati",system-ui;background:#f4f7f6;margin:0}
.container{max-width:1600px;margin:20px auto;background:#fff;padding:24px;border-radius:12px}
h1,h2{color:#2e7d32;margin-top:0}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}
.group{background:#f1f8e9;font-weight:bold}
.note{font-size:13px;background:#f9fff6;border:1px dashed #9ccc65;padding:10px;margin-top:12px}
</style>
</head>

<body>
<div class="container">

<h1>🌾 Feed • Vitamin • Medicine – ५ वर्ष</h1>
<p class="note">
✔️ १–३, ४–६, ७–१० उमेर समूह <br>
✔️ भाले / पोथी छुट्टाछुट्टै <br>
✔️ Breeding Engine बाट आएको संख्या प्रयोग
</p>

<h2>📊 ५ वर्षे खर्च (Rs)</h2>
<div id="result"></div>

</div>

<script>
// ---------- RATE TABLE ----------
const feedRate = {
  A1:{m:0.30,f:0.25},
  A2:{m:0.80,f:0.70},
  A3:{m:1.80,f:1.50},
  adult:{m:2.50,f:3.00}
};

const vitaminRate = {
  A1:{m:30,f:35},
  A2:{m:40,f:45},
  A3:{m:50,f:55},
  adult:{m:60,f:80}
};

const medicineRate = {
  A1:{m:150,f:160},
  A2:{m:200,f:220},
  A3:{m:300,f:320},
  adult:{m:400,f:500}
};

// ---------- LOAD DATA ----------
const data = JSON.parse(localStorage.getItem("BREEDING_ENGINE_5YR_RESULT")) || [];

function yearlyCost(count, feed, vit, med){
  return {
    feed: count * feed * 365,
    vitamin: count * vit * 12,
    medicine: count * med
  };
}

function render(){

  let html=`<table>
  <tr>
    <th>समूह \\ वर्ष</th>
    ${data.map(d=>`<th>${d.year}</th>`).join("")}
  </tr>`;

  const rows = [
    ["१–३ भाले","A1","m"],
    ["१–३ पोथी","A1","f"],
    ["४–६ भाले","A2","m"],
    ["४–६ पोथी","A2","f"],
    ["७–१० भाले","A3","m"],
    ["७–१० पोथी","A3","f"],
    ["बयस्क भाले","adult","m"],
    ["माउ (बयस्क पोथी)","adult","f"]
  ];

  rows.forEach(r=>{
    html+=`<tr><td>${r[0]}</td>`;
    data.forEach(y=>{
      const count = r[2]==="m" ? y.male[r[1]] : y.female[r[1]];
      const c = yearlyCost(
        count,
        feedRate[r[1]][r[2]],
        vitaminRate[r[1]][r[2]],
        medicineRate[r[1]][r[2]]
      );
      html+=`<td>${Math.round(c.feed+c.vitamin+c.medicine)}</td>`;
    });
    html+=`</tr>`;
  });

  html+=`</table>`;
  document.getElementById("result").innerHTML=html;
}

render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Feed • Vitamin • Medicine – ५ वर्ष (Detailed)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{
  font-family:"Noto Sans Devanagari","Kalimati",system-ui;
  background:#f4f7f6;margin:0
}
.container{
  max-width:1700px;margin:20px auto;
  background:#fff;padding:24px;border-radius:12px
}
h1,h2,h3{color:#2e7d32;margin-top:0}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}
.group{background:#f1f8e9;font-weight:bold}
.note{
  font-size:14px;background:#f9fff6;
  border:1px dashed #9ccc65;padding:12px;margin-top:12px
}
.small{font-size:13px;color:#444}
</style>
</head>

<body>
<div class="container">

<h1>🌾 Feed • Vitamin • Medicine — ५ वर्ष</h1>

<div class="note">
✔️ उमेर समूह: १–३, ४–६, ७–१०, बयस्क<br>
✔️ भाले / पोथी छुट्टाछुट्टै<br>
✔️ दाना, भिटामिन, औषधि अलग–अलग<br>
✔️ Breeding Engine बाट आएको ५ वर्षे संख्या प्रयोग
</div>

<!-- ================= RESULT ================= -->
<h2>📊 उमेर समूह अनुसार ५ वर्षे विस्तृत खर्च (Rs)</h2>
<div id="result"></div>

</div>

<script>
// =================================================
// RATE TABLES (FORMULA UNCHANGED)
// =================================================
const feedRate = {
  A1:{m:0.30,f:0.25},
  A2:{m:0.80,f:0.70},
  A3:{m:1.80,f:1.50},
  adult:{m:2.50,f:3.00}
};

const vitaminRate = {
  A1:{m:30,f:35},
  A2:{m:40,f:45},
  A3:{m:50,f:55},
  adult:{m:60,f:80}
};

const medicineRate = {
  A1:{m:150,f:160},
  A2:{m:200,f:220},
  A3:{m:300,f:320},
  adult:{m:400,f:500}
};

// =================================================
// LOAD BREEDING DATA (5 YEARS)
// =================================================
const data = JSON.parse(
  localStorage.getItem("BREEDING_ENGINE_5YR_RESULT")
) || [];

if(data.length===0){
  document.getElementById("result").innerHTML =
    "<p>Breeding Engine को ५ वर्षे डाटा भेटिएन।</p>";
}

// =================================================
// CALC HELPERS (FORMULA FIXED)
// =================================================
function calcFeed(count,age,sex){
  return count * feedRate[age][sex] * 365;
}
function calcVitamin(count,age,sex){
  return count * vitaminRate[age][sex] * 12;
}
function calcMedicine(count,age,sex){
  return count * medicineRate[age][sex];
}

// =================================================
// RENDER DETAILED TABLE
// =================================================
function render(){

  let html = `<table>
  <tr>
    <th rowspan="2">उमेर समूह</th>
    <th rowspan="2">लिङ्ग</th>
    <th colspan="${data.length}">५ वर्षे खर्च (Rs)</th>
  </tr>
  <tr>
    ${data.map(d=>`<th>${d.year}</th>`).join("")}
  </tr>`;

  const ageGroups = [
    ["A1","१–३ महिना"],
    ["A2","४–६ महिना"],
    ["A3","७–१० महिना"],
    ["adult","बयस्क"]
  ];

  ageGroups.forEach(a=>{
    ["m","f"].forEach(sex=>{
      html += `<tr>
        <td>${a[1]}</td>
        <td>${sex==="m"?"भाले":"पोथी"}</td>`;

      data.forEach(y=>{
        const count = sex==="m"
          ? y.male[a[0]]
          : y.female[a[0]];

        const feed = calcFeed(count,a[0],sex);
        const vit  = calcVitamin(count,a[0],sex);
        const med  = calcMedicine(count,a[0],sex);

        html += `<td>
          <div class="small">दाना: ${Math.round(feed)}</div>
          <div class="small">भिटामिन: ${Math.round(vit)}</div>
          <div class="small">औषधि: ${Math.round(med)}</div>
          <strong>${Math.round(feed+vit+med)}</strong>
        </td>`;
      });

      html += `</tr>`;
    });
  });

  html += `</table>`;
  document.getElementById("result").innerHTML = html;
}

render();
</script>

</body>
</html>

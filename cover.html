<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Cover – Business Project</title>

<style>
body{
 font-family:Arial, sans-serif;
 margin:0;
 background:#f4f6f7
}

.page{
 max-width:900px;
 margin:40px auto;
 background:#fff;
 padding:50px;
 min-height:90vh;
 box-shadow:0 0 10px rgba(0,0,0,0.15);
 display:flex;
 flex-direction:column;
 justify-content:space-between
}

/* ===== HEADER ===== */
.header{
 text-align:center
}
.header h1{
 font-size:32px;
 color:#2e7d32;
 margin:0
}
.header p{
 font-size:16px;
 color:#555;
 margin-top:8px
}

/* ===== MAP ===== */
.map{
 margin:30px 0;
 border:2px solid #2e7d32
}
.map iframe{
 width:100%;
 height:300px;
 border:0
}

/* ===== NARRATION ===== */
.narration{
 background:#f1f8e9;
 padding:24px;
 font-size:16px;
 line-height:1.8;
 border-left:6px solid #2e7d32;
 color:#333
}

/* ===== FOOTER ===== */
.footer{
 text-align:center;
 font-size:14px;
 color:#333;
 margin-top:40px
}
.footer strong{color:#2e7d32}

/* ===== PRINT ===== */
@media print{
 body{background:#fff}
 .page{
  margin:0;
  box-shadow:none;
  min-height:100vh
 }
}
</style>
</head>

<body>

<div class="page">

 <!-- HEADER -->
 <div class="header">
  <h1 id="projectName">व्यवसायिक परियोजना</h1>
  <p>(Business Project Proposal)</p>
 </div>

 <!-- MAP -->
 <div class="map">
  <iframe id="mapFrame"
   loading="lazy"
   referrerpolicy="no-referrer-when-downgrade">
  </iframe>
 </div>

 <!-- NARRATION -->
 <div class="narration" id="projectNarration">
  परियोजनाको संक्षिप्त विवरण यहाँ देखिनेछ ।
 </div>

 <!-- FOOTER -->
 <div class="footer">
  <strong>संस्थाको नाम:</strong>
  <span id="orgName">—</span><br>
  <strong>ठेगाना:</strong>
  <span id="orgAddress">—</span><br>
  <strong>सम्पर्क:</strong>
  <span id="orgContact">—</span>
 </div>

</div>

<script>
/* ===== AUTO-FILL FROM short-info.html ===== */

const projectName =
 localStorage.getItem("projectName") || "व्यवसायिक परियोजना";

const projectAddress =
 localStorage.getItem("projectAddress") || "Nepal";

const projectNarration =
 localStorage.getItem("projectNarration")
 || "परियोजनाको संक्षिप्त विवरण उपलब्ध छैन।";

const organizationName =
 localStorage.getItem("organizationName") || "—";

const organizationAddress =
 localStorage.getItem("organizationAddress") || "—";

const organizationContact =
 localStorage.getItem("organizationContact") || "—";

/* Render text */
document.getElementById("projectName").innerText = projectName;
document.getElementById("projectNarration").innerText = projectNarration;
document.getElementById("orgName").innerText = organizationName;
document.getElementById("orgAddress").innerText = organizationAddress;
document.getElementById("orgContact").innerText = organizationContact;

/* Google Map from address */
document.getElementById("mapFrame").src =
 "https://www.google.com/maps?q=" +
 encodeURIComponent(projectAddress) +
 "&output=embed";
</script>

</body>
</html>

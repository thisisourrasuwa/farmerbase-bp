<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Create Letters | FarmerBase BP Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
 font-family:"Noto Sans Devanagari","Kalimati","Nirmala UI",system-ui;
 background:#f4f7f6;
 margin:0
}
.wrap{
 max-width:1000px;
 margin:20px auto;
 background:#fff;
 padding:22px;
 border-radius:12px
}
h2{color:#2e7d32;margin-top:0}
.small{font-size:13px;color:#555}

label{font-weight:600}
input,textarea{
 width:100%;
 padding:8px;
 margin:6px 0 12px
}
textarea{min-height:140px}

button{
 padding:8px 16px;
 border:none;
 border-radius:6px;
 background:#2e7d32;
 color:#fff;
 cursor:pointer
}
button.gray{background:#455a64}
button.red{background:#c62828}

.grid{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:20px
}

.list{
 border-left:1px solid #ddd;
 padding-left:15px
}
.item{
 padding:8px;
 border:1px solid #ccc;
 border-radius:6px;
 margin-bottom:8px;
 cursor:pointer
}
.item.active{
 background:#e8f5e9;
 border-color:#2e7d32
}
.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}

.attach-row{
 display:flex;
 gap:8px;
 margin-bottom:6px
}
.attach-row input{flex:1}
</style>
</head>

<body>

<div class="wrap">
<h2>✉️ पत्र तयार गर्ने प्रणाली</h2>
<p class="small">सरकारी, बैंक तथा संस्थागत प्रयोजनका लागि औपचारिक पत्र</p>

<div class="grid">

<!-- ================= EDITOR ================= -->
<div>

<label>पेश गर्ने कार्यालय (Self भए खाली छोड्नुहोस्)</label>
<input id="office" placeholder="जस्तै: नेपाल सरकार, कृषि मन्त्रालय">

<label>विषय</label>
<input id="subject" placeholder="जस्तै: प्रस्तावना अध्ययन गरी स्वीकृत गरिदिनुहुन">

<label>पत्रको मुख्य व्यहोरा</label>
<textarea id="content" placeholder="महोदय,&#10;प्रस्तुत विषयमा ..."></textarea>

<label>संलग्न कागजपत्र</label>
<div id="attachList"></div>
<button class="gray" onclick="addAttachment()">➕ Add another</button>

<div class="actions" style="margin-top:15px">
 <button onclick="saveLetter()">💾 Save</button>
 <button class="gray" onclick="newLetter()">➕ New</button>
 <button class="gray" onclick="printLetter()">🖨 Print</button>
 <button class="red" onclick="deleteLetter()">🗑 Delete</button>
</div>

</div>

<!-- ================= LIST ================= -->
<div class="list">
 <h3>📂 Saved Letters</h3>
 <div id="letterList"></div>
</div>

</div>
</div>

<script>
/* ===== AUTO FROM short-info ===== */
const orgName = localStorage.getItem("organizationName") || "संस्थाको नाम";
const orgAddress = localStorage.getItem("organizationAddress") || "";
const orgContact = localStorage.getItem("organizationContact") || "";
const regNo = localStorage.getItem("registrationNo") || "—";
const panNo = localStorage.getItem("panNo") || "—";
const proprietor = localStorage.getItem("proprietorName") || "—";

/* ===== STORAGE ===== */
const KEY="SYSTEM_LETTERS_V3";
let letters=JSON.parse(localStorage.getItem(KEY))||[];
let activeId=null;

/* ===== ATTACHMENTS ===== */
function addAttachment(val=""){
 const d=document.createElement("div");
 d.className="attach-row";
 d.innerHTML=`<input value="${val}" placeholder="कागजपत्रको नाम">`;
 attachList.appendChild(d);
}
addAttachment();

/* ===== LIST ===== */
function renderList(){
 letterList.innerHTML="";
 letters.forEach(l=>{
  const d=document.createElement("div");
  d.className="item"+(l.id===activeId?" active":"");
  d.innerHTML=`<b>${l.subject}</b>`;
  d.onclick=()=>loadLetter(l.id);
  letterList.appendChild(d);
 });
}

/* ===== LOAD ===== */
function loadLetter(id){
 const l=letters.find(x=>x.id===id);
 if(!l) return;
 activeId=id;
 office.value=l.office;
 subject.value=l.subject;
 content.value=l.content;
 attachList.innerHTML="";
 l.attachments.forEach(a=>addAttachment(a));
 renderList();
}

/* ===== SAVE ===== */
function saveLetter(){
 const attachments=[...attachList.querySelectorAll("input")]
  .map(i=>i.value).filter(v=>v.trim());
 if(!subject.value||!content.value){
  alert("विषय र व्यहोरा अनिवार्य छ");
  return;
 }
 const data={
  office:office.value,
  subject:subject.value,
  content:content.value,
  attachments
 };
 if(activeId){
  Object.assign(letters.find(x=>x.id===activeId),data);
 }else{
  letters.push({id:Date.now(),...data});
  activeId=letters.at(-1).id;
 }
 localStorage.setItem(KEY,JSON.stringify(letters));
 renderList();
}

/* ===== NEW ===== */
function newLetter(){
 activeId=null;
 office.value=subject.value=content.value="";
 attachList.innerHTML=""; addAttachment();
 renderList();
}

/* ===== DELETE ===== */
function deleteLetter(){
 if(!activeId||!confirm("यो पत्र हटाउने?")) return;
 letters=letters.filter(l=>l.id!==activeId);
 localStorage.setItem(KEY,JSON.stringify(letters));
 newLetter();
}

/* ===== PRINT (OFFICIAL FORMAT) ===== */
function printLetter(){
 const date=new Date().toLocaleDateString("ne-NP");
 const atts=[...attachList.querySelectorAll("input")]
  .map((i,idx)=>`${idx+1}. ${i.value}`).join("<br>");

 const w=window.open("");
 w.document.write(`
<html><head>
<style>
body{font-family:"Kalimati","Noto Sans Devanagari";padding:40px}
.header{text-align:center;font-weight:bold}
.right{float:right}
.left{float:left}
.clear{clear:both}
.footer{margin-top:60px}
</style></head>
<body>

<div class="header">
${orgName}<br>${orgAddress}
</div><hr>

<div class="right">मिति: ${date}</div>
<div class="left">${office.value||"Self"}</div>
<div class="clear"></div>

<p><b>विषय :</b> ${subject.value}</p>

<p>महोदय,</p>
<p>${content.value.replace(/\n/g,"<br>")}</p>

<p><b>संलग्न कागजपत्र:</b><br>${atts||"—"}</p>

<div class="footer">
निवेदक: ${proprietor}<br>
सही: ___________<br><br>
दर्ता नं: ${regNo}<br>
पान नं: ${panNo}<br>
सम्पर्क नं: ${orgContact}
</div>

</body></html>
`);
 w.document.close();
 w.print();
}

/* INIT */
renderList();
</script>

</body>
</html>

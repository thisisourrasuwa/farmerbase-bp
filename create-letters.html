<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Create Letters | FarmerBase BP Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
 font-family:"Noto Sans Devanagari","Kalimati","Nirmala UI",system-ui;
 background:#f4f7f6;
 margin:0
}
.wrap{
 max-width:1000px;
 margin:20px auto;
 background:#fff;
 padding:22px;
 border-radius:12px
}
h2{color:#2e7d32;margin-top:0}
.small{font-size:13px;color:#555}

label{font-weight:600}
input,select,textarea{
 width:100%;
 padding:8px;
 margin:6px 0 12px
}
textarea{min-height:160px}

button{
 padding:8px 16px;
 border:none;
 border-radius:6px;
 background:#2e7d32;
 color:#fff;
 cursor:pointer
}
button.gray{background:#455a64}
button.red{background:#c62828}

.grid{
 display:grid;
 grid-template-columns:2fr 1fr;
 gap:20px
}

.list{
 border-left:1px solid #ddd;
 padding-left:15px
}
.item{
 padding:8px;
 border:1px solid #ccc;
 border-radius:6px;
 margin-bottom:8px;
 cursor:pointer
}
.item.active{
 background:#e8f5e9;
 border-color:#2e7d32
}
.actions{
 display:flex;
 gap:8px;
 flex-wrap:wrap
}
</style>
</head>

<body>

<div class="wrap">
<h2>✉️ Letter Generator</h2>
<p class="small">सरकारी, बैंक तथा संस्थागत प्रयोजनका लागि औपचारिक पत्र तयार गर्नुहोस्।</p>

<div class="grid">

<!-- ================= EDITOR ================= -->
<div>

<label>पत्रको शीर्षक</label>
<input id="title" placeholder="जस्तै: बैंक ऋण निवेदन पत्र">

<label>पेश गर्ने कार्यालय (Self भए खाली छोड्नुहोस्)</label>
<input id="office" placeholder="जस्तै: श्री कृषि विकास बैंक, रसुवा">

<label>विषय</label>
<input id="subject" placeholder="जस्तै: ऋण उपलब्ध गराइदिनुहुन">

<label>पत्रको मुख्य व्यहोरा</label>
<textarea id="content"></textarea>

<label>संलग्न कागजपत्र (एक लाइनमा एउटा)</label>
<textarea id="attachments" placeholder="१. नागरिकता प्रतिलिपि&#10;२. व्यवसाय दर्ता प्रमाणपत्र"></textarea>

<div class="actions">
 <button onclick="saveLetter()">💾 Save</button>
 <button class="gray" onclick="newLetter()">➕ New</button>
 <button class="gray" onclick="printLetter()">🖨 Print</button>
 <button class="red" onclick="deleteLetter()">🗑 Delete</button>
</div>

</div>

<!-- ================= LIST ================= -->
<div class="list">
 <h3>📂 Saved Letters</h3>
 <div id="letterList"></div>
</div>

</div>
</div>

<script>
/* ===== AUTO FROM short-info ===== */
const orgName = localStorage.getItem("organizationName") || "संस्थाको नाम";
const orgAddress = localStorage.getItem("organizationAddress") || "";
const orgContact = localStorage.getItem("organizationContact") || "";
const regNo = localStorage.getItem("registrationNo") || "—";
const panNo = localStorage.getItem("panNo") || "—";
const proprietor = localStorage.getItem("proprietorName") || "—";

/* ===== STORAGE ===== */
const KEY="SYSTEM_LETTERS_V2";
let letters=JSON.parse(localStorage.getItem(KEY))||[];
let activeId=null;

/* ===== LIST ===== */
function renderList(){
 letterList.innerHTML="";
 letters.forEach(l=>{
  const d=document.createElement("div");
  d.className="item"+(l.id===activeId?" active":"");
  d.innerHTML=`<b>${l.title}</b><br><span class="small">${l.subject||""}</span>`;
  d.onclick=()=>loadLetter(l.id);
  letterList.appendChild(d);
 });
}

/* ===== LOAD ===== */
function loadLetter(id){
 const l=letters.find(x=>x.id===id);
 if(!l) return;
 activeId=id;
 title.value=l.title;
 office.value=l.office;
 subject.value=l.subject;
 content.value=l.content;
 attachments.value=l.attachments;
 renderList();
}

/* ===== SAVE ===== */
function saveLetter(){
 if(!title.value||!content.value){
  alert("शीर्षक र मुख्य व्यहोरा अनिवार्य छ");
  return;
 }
 if(activeId){
  Object.assign(letters.find(x=>x.id===activeId),{
   title:title.value,office:office.value,
   subject:subject.value,content:content.value,
   attachments:attachments.value
  });
 }else{
  letters.push({
   id:Date.now(),
   title:title.value,
   office:office.value,
   subject:subject.value,
   content:content.value,
   attachments:attachments.value
  });
  activeId=letters.at(-1).id;
 }
 localStorage.setItem(KEY,JSON.stringify(letters));
 renderList();
}

/* ===== NEW ===== */
function newLetter(){
 activeId=null;
 title.value=office.value=subject.value=content.value=attachments.value="";
 renderList();
}

/* ===== DELETE ===== */
function deleteLetter(){
 if(!activeId||!confirm("यो पत्र हटाउने?")) return;
 letters=letters.filter(l=>l.id!==activeId);
 localStorage.setItem(KEY,JSON.stringify(letters));
 newLetter();
}

/* ===== PRINT (OFFICIAL FORMAT) ===== */
function printLetter(){
 const w=window.open("");
 const date=new Date().toLocaleDateString("ne-NP");
 const attachList = attachments.value
  .split("\n").filter(x=>x.trim())
  .map(x=>"• "+x).join("<br>");

 w.document.write(`
<html><head><title>${title.value}</title>
<style>
body{font-family:"Kalimati","Noto Sans Devanagari";padding:40px}
.header{text-align:center;font-weight:bold}
.right{float:right}
.left{float:left}
.clear{clear:both}
.footer{margin-top:60px}
</style></head>
<body>

<div class="header">
${orgName}<br>${orgAddress}
</div><hr>

<div class="right">मिति: ${date}</div>
<div class="left">
${office.value?office.value:"Self"}
</div>
<div class="clear"></div>

<p><b>विषय:</b> ${subject.value}</p>

<p>${content.value.replace(/\n/g,"<br>")}</p>

<p><b>संलग्न कागजपत्र:</b><br>${attachList||"—"}</p>

<div class="footer">
निवेदक: ${proprietor}<br>
सही: ___________<br><br>
दर्ता नं: ${regNo}<br>
पान नं: ${panNo}<br>
सम्पर्क नं: ${orgContact}
</div>

</body></html>
`);
 w.document.close();
 w.print();
}

/* INIT */
renderList();
</script>

</body>
</html>

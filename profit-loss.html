<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>नाफा वितरण</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}

/* ===== HEADER ===== */
header{
 background:#2e7d32;
 color:#fff;
 padding:18px 20px;
 text-align:center;
 font-size:22px;
 font-weight:700;
 letter-spacing:.4px;
 box-shadow:0 2px 6px rgba(0,0,0,0.2)
}

/* ===== SIDE PAGE FOLLOW ===== */
.side-nav{
 position:fixed;
 top:50%;
 transform:translateY(-50%);
 width:48px;
 height:48px;
 border-radius:50%;
 background:#2e7d32;
 color:#fff;
 font-size:26px;
 display:flex;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 z-index:999;
 box-shadow:0 4px 10px rgba(0,0,0,.25)
}
.side-nav.prev{left:15px}
.side-nav.next{right:15px}
.side-nav:hover{background:#1b5e20}

/* ===== CONTAINER ===== */
.container{
 max-width:1100px;
 margin:auto;
 background:#fff;
 padding:20px 70px; /* arrow safe zone */
 min-height:70vh
}

.summary{
 background:#f1f8e9;
 padding:16px;
 margin-bottom:20px;
 font-size:16px
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:15px
}
th,td{
 border:1px solid #ccc;
 padding:10px;
 text-align:center
}
th{background:#e8f5e9}

input{
 width:100%;
 padding:6px;
 box-sizing:border-box
}

.total{
 font-size:18px;
 font-weight:bold;
 text-align:right;
 margin-top:15px
}

.ok{color:#2e7d32}
.warn{color:#c62828}

footer{
 background:#2e7d32;
 color:#fff;
 padding:12px 20px;
 text-align:center;
 font-size:14px
}
</style>
</head>

<body>

<!-- ===== SIDE NAVIGATION ===== -->
<div class="side-nav prev" onclick="location.href='profit-loss.html'">⬅</div>
<div class="side-nav next" onclick="location.href='five-year-projection.html'">➡</div>

<!-- ===== HEADER ===== -->
<header>
  नाफा वितरण
</header>

<div class="container">

<div class="summary">
 ✔️ यो पेजमा <b>Profit / Loss</b> बाट आएको <b>शुद्ध नाफा</b>  
 विभिन्न शीर्षकमा बाँडफाँट गरिन्छ ।  
</div>

<table>
<thead>
<tr>
 <th>वितरण शीर्षक</th>
 <th>प्रतिशत (%)</th>
 <th>रकम (Auto)</th>
</tr>
</thead>
<tbody id="distBody"></tbody>
</table>

<button onclick="addRow()">➕ वितरण शीर्षक थप्नुहोस्</button>

<div class="total">
 कुल नाफा: <span id="netProfit">0.00</span><br>
 वितरण भएको: <span id="usedAmount">0.00</span><br>
 बाँकी: <span id="remaining">0.00</span>
 <span id="status"></span>
</div>

</div>

<footer>
 FarmerBase BP Engine – Profit Distribution
</footer>

<script>
/* =================================================
   1️⃣ LOAD NET PROFIT (FROM PROFIT-LOSS)
================================================= */
const netProfit =
 Number(localStorage.getItem("netProfit")) || 0;

/* =================================================
   2️⃣ DISTRIBUTION STATE
================================================= */
let distributions =
 JSON.parse(localStorage.getItem("profitDistribution")) || [];

/* =================================================
   3️⃣ SAVE
================================================= */
function save(){
 localStorage.setItem(
  "profitDistribution",
  JSON.stringify(distributions)
 );
}

/* =================================================
   4️⃣ ADD / UPDATE
================================================= */
function addRow(){
 distributions.push({
  title:"",
  percent:0
 });
 save(); render();
}

function update(i,field,val){
 distributions[i][field] = field==="percent"
  ? Number(val)||0
  : val;
 save(); render();
}

/* =================================================
   5️⃣ RENDER
================================================= */
function render(){
 const tb = document.getElementById("distBody");
 tb.innerHTML = "";

 let used = 0;

 distributions.forEach((d,i)=>{
  const amt = netProfit * (d.percent||0) / 100;
  used += amt;

  tb.innerHTML += `
<tr>
<td>
 <input value="${d.title}"
  onchange="update(${i},'title',this.value)">
</td>
<td>
 <input type="number" value="${d.percent}"
  onchange="update(${i},'percent',this.value)">
</td>
<td>${amt.toFixed(2)}</td>
</tr>`;
 });

 const remaining = netProfit - used;

 document.getElementById("netProfit").innerText =
  netProfit.toFixed(2);

 document.getElementById("usedAmount").innerText =
  used.toFixed(2);

 const remEl = document.getElementById("remaining");
 remEl.innerText = remaining.toFixed(2);

 const st = document.getElementById("status");
 if(Math.abs(remaining) < 0.01){
  st.innerHTML = ' <span class="ok">✔️ 100% वितरण भयो</span>';
 }else{
  st.innerHTML = ' <span class="warn">❗ 100% हुनुपर्छ</span>';
 }
}

render();
</script>

</body>
</html>

<script>
/* =================================================
   1️⃣ TOTAL INCOME — ONLY FROM PRODUCTIONS
================================================= */
let totalIncome = 0;
const productions =
 JSON.parse(localStorage.getItem("productions")) || [];

productions.forEach(p=>{
 totalIncome += Number(p.total || 0);
});

/* =================================================
   2️⃣ VARIABLE EXPENSE — DIRECT ANNUAL VALUE
================================================= */
const annualVar =
 Number(localStorage.getItem("variable_annual_cost")) || 0;

/* =================================================
   3️⃣ INTEREST EXPENSE
================================================= */
const interestExpense =
 Number(localStorage.getItem("annual_interest_cost")) || 0;

/* =================================================
   4️⃣ TOTAL & NET
================================================= */
const totalExpense = annualVar + interestExpense;
const netProfit = totalIncome - totalExpense;

/* =================================================
   5️⃣ RENDER
================================================= */
document.getElementById("totalIncome").innerText =
 totalIncome.toFixed(2);

document.getElementById("annualVar").innerText =
 annualVar.toFixed(2);

document.getElementById("interestExpense").innerText =
 interestExpense.toFixed(2);

document.getElementById("totalExpense").innerText =
 totalExpense.toFixed(2);

const np=document.getElementById("netProfit");
np.innerText = netProfit.toFixed(2);
np.className =
 "amount net " + (netProfit < 0 ? "loss":"profit");

/* =================================================
   6️⃣ SAVE CLEAN VALUES FOR NEXT PAGES
================================================= */
localStorage.setItem("totalIncome", totalIncome);
localStorage.setItem("totalExpense", totalExpense);
localStorage.setItem("netProfit", netProfit);
</script>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>उत्पादन (Production)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:"Noto Sans Devanagari","Kalimati",system-ui;background:#f4f7f6;margin:0}
.container{max-width:1800px;margin:20px auto;background:#fff;padding:24px;border-radius:12px}
h1,h2,h3{color:#2e7d32;margin-top:0}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}
input{width:70px}
.note{font-size:14px;background:#f9fff6;border:1px dashed #9ccc65;padding:12px;margin:12px 0}
button{padding:6px 14px;background:#2e7d32;color:#fff;border:none;border-radius:6px}
.group{background:#f1f8e9;font-weight:bold}
</style>
</head>

<body>
<div class="container">

<h1>📦 उत्पादन (Production)</h1>

<div class="note">
✔️ Breeding आधारित उत्पादन = वर्ष–वर्ष<br>
✔️ अन्य उत्पादन = ५ वर्षका लागि घोषणा मात्र (परिमाण छैन)
</div>

<!-- ================= BREEDING BASED ================= -->
<h2>🐖 पशुजन्य उत्पादन (Breeding आधारित – Yearwise)</h2>
<div id="breedingProduction"></div>

<!-- ================= OTHER PRODUCTION ================= -->
<h2>➕ यस व्यवसायका अन्य उत्पादन (५ वर्षे)</h2>
<div id="otherProduction"></div>

</div>

<script>
// ===================================================
// LOAD BREEDING DATA
// ===================================================
const data = JSON.parse(
  localStorage.getItem("BREEDING_ENGINE_5YR_RESULT")
) || [];

const years = data.map(d=>d.year);

// ===================================================
// BREEDING BASED PRODUCTION (YEARWISE)
// ===================================================
function renderBreedingProduction(){

  if(data.length===0){
    document.getElementById("breedingProduction").innerHTML =
      "<p style='color:red'>Breeding Engine चलाएर मात्र यो पेज खोल्नुहोस्।</p>";
    return;
  }

  const rows = [
    ["१–३ महिना भाले","A1","m"],
    ["१–३ महिना पोथी","A1","f"],
    ["४–६ महिना भाले","A2","m"],
    ["४–६ महिना पोथी","A2","f"],
    ["७–१० महिना भाले","A3","m"],
    ["७–१० महिना पोथी","A3","f"],
    ["बयस्क भाले","adult","m"],
    ["बयस्क माउ","adult","f"]
  ];

  let html=`<table>
  <tr>
    <th rowspan="2">समूह</th>
    <th rowspan="2">kg / Head</th>
    <th colspan="${years.length}">वर्ष अनुसार संख्या (Head)</th>
  </tr>
  <tr>${years.map(y=>`<th>${y}</th>`).join("")}</tr>`;

  rows.forEach(r=>{
    html+=`<tr>
      <td>${r[0]}</td>
      <td><input value="70"></td>`;
    data.forEach(y=>{
      const count = r[2]==="m"
        ? y.male[r[1]]
        : y.female[r[1]];
      html+=`<td>${count}</td>`;
    });
    html+=`</tr>`;
  });

  html+=`</table>`;
  document.getElementById("breedingProduction").innerHTML=html;
}

// ===================================================
// OTHER PRODUCTION (5 YEAR – NO QUANTITY)
// ===================================================
function renderOtherProduction(){

  let html=`<table id="otherTable">
  <tr>
    <th>उत्पादन नाम</th>
    <th>इकाइ</th>
    <th>टिप्पणी (५ वर्षे)</th>
  </tr>
  <tr>
    <td><input value="गोबर मल"></td>
    <td><input value="kg"></td>
    <td>५ वर्षमा नियमित उत्पादन</td>
  </tr>
  </table>
  <button onclick="addOtherRow()">➕ थप्नुहोस्</button>`;

  document.getElementById("otherProduction").innerHTML=html;
}

function addOtherRow(){
  const t=document.getElementById("otherTable");
  const r=t.insertRow(-1);
  r.innerHTML=`
    <td><input></td>
    <td><input></td>
    <td>५ वर्षे सह–उत्पादन</td>`;
}

// ===================================================
renderBreedingProduction();
renderOtherProduction();
</script>

</body>
</html>

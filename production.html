<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Production</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial,system-ui;background:#f7f7f7;margin:0}
.container{max-width:1200px;margin:20px auto;background:#fff;padding:20px}
h1{color:#2e7d32;margin-top:0}

table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #ccc;padding:10px;text-align:center}
th{background:#e8f5e9}

input{width:95%;padding:6px}
button{padding:6px 12px;cursor:pointer}

.lock{background:#f1f8e9;font-weight:600}
.delete{background:#c62828;color:#fff;border:none}

/* PAGE FLOW */
.page-follow{
 position:fixed;right:14px;top:50%;
 transform:translateY(-50%);
 display:flex;flex-direction:column;gap:12px;z-index:999
}
.pf-btn{
 width:46px;height:46px;border-radius:50%;
 background:#2e7d32;color:#fff;
 display:flex;align-items:center;justify-content:center;
 text-decoration:none;font-size:22px
}
</style>
</head>

<body>

<div class="container">
<h1>📦 उत्पादन (Year-wise)</h1>

<table id="prodTable">
<thead>
<tr>
 <th>उत्पादन नाम</th>
 <th>इकाई</th>
 <th>परिमाण</th>
 <th>कैफियत</th>
 <th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button onclick="addRow()">➕ अन्य उत्पादन थप्नुहोस्</button>
</div>

<!-- PAGE FLOW -->
<div class="page-follow">
 <a href="feed-vitamin-medicine-5yr.html" class="pf-btn">⬅️</a>
 <a href="expenses.demo.html" class="pf-btn">➡️</a>
</div>

<script>
// ================= LOAD BREEDING DATA =================
const breeding =
 JSON.parse(localStorage.getItem("BREEDING_ENGINE_5YR_RESULT")) || [];

// ================= LOAD MANUAL =================
let manual =
 JSON.parse(localStorage.getItem("MANUAL_PRODUCTION")) || [];

// ================= SAVE =================
function save(){
 localStorage.setItem("MANUAL_PRODUCTION", JSON.stringify(manual));
}

// ================= RENDER =================
function render(){
 const tbody=document.querySelector("#prodTable tbody");
 tbody.innerHTML="";

 // ---- AUTO YEAR-WISE BREEDING SALES ----
 breeding.forEach(y=>{
  const qty =
   (y.sold9M||0)+(y.sold9F||0)+(y.soldAdultM||0)+(y.soldAdultF||0);

  const tr=document.createElement("tr");
  tr.innerHTML=`
   <td class="lock">बंगुर बिक्री (Year ${y.year})</td>
   <td class="lock">जनावर</td>
   <td class="lock">${qty}</td>
   <td class="lock">Animal Breeding Engine बाट स्वचालित</td>
   <td class="lock">🔒</td>`;
  tbody.appendChild(tr);
 });

 // ---- MANUAL PRODUCTS ----
 manual.forEach((p,i)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`
   <td><input value="${p.name}" onchange="update(${i},'name',this.value)"></td>
   <td><input value="${p.unit}" onchange="update(${i},'unit',this.value)"></td>
   <td><input type="number" value="${p.qty}" onchange="update(${i},'qty',this.value)"></td>
   <td><input value="${p.note}" onchange="update(${i},'note',this.value)"></td>
   <td><button class="delete" onclick="del(${i})">🗑️</button></td>`;
  tbody.appendChild(tr);
 });
}

// ================= CRUD =================
function addRow(){
 manual.push({name:"",unit:"",qty:"",note:""});
 save(); render();
}
function update(i,f,v){manual[i][f]=v;save();}
function del(i){
 if(confirm("हटाउने हो ?")){
  manual.splice(i,1);save();render();
 }
}

render();
</script>

</body>
</html>

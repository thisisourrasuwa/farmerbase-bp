<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>उत्पादन (Year-wise)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:system-ui;background:#f4f7f6;margin:0}
.container{max-width:1600px;margin:20px auto;background:#fff;padding:24px;border-radius:12px}
h1{color:#2e7d32;margin-top:0}

table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}

input{width:100%;padding:6px}
.lock{background:#f1f8e9;font-weight:600}
button{padding:6px 12px;cursor:pointer}

.add{background:#2e7d32;color:#fff;border:none}
.del{background:#c62828;color:#fff;border:none}

/* PAGE FLOW */
.page-follow{
 position:fixed;right:14px;top:50%;
 transform:translateY(-50%);
 display:flex;flex-direction:column;gap:12px;z-index:999
}
.pf-btn{
 width:46px;height:46px;border-radius:50%;
 background:#2e7d32;color:#fff;
 display:flex;align-items:center;justify-content:center;
 text-decoration:none;font-size:22px
}
</style>
</head>

<body>

<div class="container">
<h1>📦 उत्पादन (Year-wise)</h1>

<table id="prod">
<thead>
<tr>
 <th rowspan="2">उत्पादन नाम</th>
 <th rowspan="2">इकाई</th>
 <th colspan="5">वर्ष</th>
 <th rowspan="2">कैफियत</th>
 <th rowspan="2">Action</th>
</tr>
<tr>
 <th>Year 1</th>
 <th>Year 2</th>
 <th>Year 3</th>
 <th>Year 4</th>
 <th>Year 5</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="add" onclick="addManual()">➕ अन्य उत्पादन थप्नुहोस्</button>
</div>

<!-- PAGE FLOW -->
<div class="page-follow">
 <a href="feed-vitamin-medicine-5yr.html" class="pf-btn">⬅️</a>
 <a href="expenses.demo.html" class="pf-btn">➡️</a>
</div>

<script>
// ================= LOAD BREEDING DATA =================
const breeding =
 JSON.parse(localStorage.getItem("BREEDING_ENGINE_5YR_RESULT")) || [];

// Helper to get year value safely
function yv(y, key){
 const row = breeding.find(b=>b.year===y);
 return row ? (row[key]||0) : 0;
}

// ================= MANUAL PRODUCTS =================
let manual =
 JSON.parse(localStorage.getItem("MANUAL_PRODUCTION_5YR_COL")) || [];

function save(){
 localStorage.setItem("MANUAL_PRODUCTION_5YR_COL", JSON.stringify(manual));
}

// ================= RENDER =================
function render(){
 const tb=document.querySelector("#prod tbody");
 tb.innerHTML="";

 // ---- AUTO BREEDING ROWS ----
 const autoRows=[
  ["९–१२ भाले बिक्री","sold9M"],
  ["९–१२ पोथी बिक्री","sold9F"],
  ["बयस्क भाले बिक्री","soldAdultM"],
  ["माउ बिक्री","soldAdultF"]
 ];

 autoRows.forEach(r=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`
   <td class="lock">${r[0]}</td>
   <td class="lock">जनावर</td>
   ${[1,2,3,4,5].map(y=>`<td class="lock">${yv(y,r[1])}</td>`).join("")}
   <td class="lock">Animal Breeding Engine बाट स्वचालित</td>
   <td class="lock">🔒</td>`;
  tb.appendChild(tr);
 });

 // ---- MANUAL ROWS ----
 manual.forEach((p,i)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`
   <td><input value="${p.name}" onchange="upd(${i},'name',this.value)"></td>
   <td><input value="${p.unit}" onchange="upd(${i},'unit',this.value)"></td>
   ${[1,2,3,4,5].map(y=>`
     <td><input type="number" value="${p['y'+y]||''}"
         onchange="upd(${i},'y${y}',this.value)"></td>`).join("")}
   <td><input value="${p.note||''}" onchange="upd(${i},'note',this.value)"></td>
   <td><button class="del" onclick="del(${i})">🗑️</button></td>`;
  tb.appendChild(tr);
 });
}

// ================= CRUD =================
function addManual(){
 manual.push({name:"",unit:"",y1:"",y2:"",y3:"",y4:"",y5:"",note:""});
 save(); render();
}
function upd(i,f,v){manual[i][f]=v;save();}
function del(i){
 if(confirm("हटाउने हो ?")){
  manual.splice(i,1);save();render();
 }
}

render();
</script>

</body>
</html>

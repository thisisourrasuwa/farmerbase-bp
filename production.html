<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Production</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:"Noto Sans Devanagari","Kalimati",system-ui;background:#f4f7f6;margin:0}
.container{max-width:1600px;margin:20px auto;background:#fff;padding:24px;border-radius:12px}
h1,h2,h3{color:#2e7d32;margin-top:0}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}
.group{background:#f1f8e9;font-weight:bold}
input{width:90px}
.note{font-size:14px;background:#f9fff6;border:1px dashed #9ccc65;padding:12px;margin:12px 0}
button{padding:6px 14px;background:#2e7d32;color:#fff;border:none;border-radius:6px}
</style>
</head>

<body>
<div class="container">

<h1>📦 उत्पादन (Production)</h1>

<div class="note">
✔️ Breeding Engine को उमेर समूह र लिङ्गगत संरचना जस्ताको तस्तै<br>
✔️ यहाँ <b>परिमाण (kg / unit)</b> मात्र देखाइन्छ<br>
✔️ आम्दानी यहाँ गणना हुँदैन
</div>

<h2>🐖 पशुजन्य उत्पादन (Breeding-based)</h2>
<div id="breedingProduction"></div>

<h2>➕ यस व्यवसायका अन्य उत्पादन</h2>
<div id="otherProduction"></div>

</div>

<script>
// ===================================================
// LOAD BREEDING DATA
// ===================================================
const data = JSON.parse(
  localStorage.getItem("BREEDING_ENGINE_5YR_RESULT")
) || [];

if(data.length===0){
  document.getElementById("breedingProduction").innerHTML =
    "<p>Breeding Engine को डाटा भेटिएन।</p>";
}

// ===================================================
// RENDER BREEDING-BASED PRODUCTION
// ===================================================
function renderBreedingProduction(){

  const rows = [
    ["१–३ महिना भाले","A1","m"],
    ["१–३ महिना पोथी","A1","f"],
    ["४–६ महिना भाले","A2","m"],
    ["४–६ महिना पोथी","A2","f"],
    ["७–१० महिना भाले","A3","m"],
    ["७–१० महिना पोथी","A3","f"],
    ["बयस्क भाले","adult","m"],
    ["बयस्क माउ","adult","f"]
  ];

  let html = `<table>
  <tr>
    <th rowspan="2">समूह</th>
    <th rowspan="2">औसत उत्पादन (kg / head)</th>
    <th colspan="${data.length}">वर्ष</th>
  </tr>
  <tr>
    ${data.map(d=>`<th>${d.year}</th>`).join("")}
  </tr>`;

  rows.forEach(r=>{
    html += `<tr>
      <td>${r[0]}</td>
      <td><input value="70"></td>`;

    data.forEach(y=>{
      const count = r[2]==="m"
        ? y.male[r[1]]
        : y.female[r[1]];

      html += `<td>${count}</td>`;
    });

    html += `</tr>`;
  });

  html += `</table>`;
  document.getElementById("breedingProduction").innerHTML = html;
}

// ===================================================
// OTHER PRODUCTION (MANUAL)
// ===================================================
function renderOtherProduction(){

  let html = `<table>
  <tr>
    <th>उत्पादन नाम</th>
    <th>इकाइ (kg / unit)</th>
    <th>वार्षिक परिमाण</th>
    <th>कार्य</th>
  </tr>
  <tr>
    <td><input value="गोबर मल"></td>
    <td><input value="kg"></td>
    <td><input value="0"></td>
    <td></td>
  </tr>
  </table>
  <button onclick="addRow()">➕ थप्नुहोस्</button>`;

  document.getElementById("otherProduction").innerHTML = html;
}

function addRow(){
  const table = document.querySelector("#otherProduction table");
  const r = table.insertRow(-1);
  r.innerHTML = `
    <td><input></td>
    <td><input></td>
    <td><input></td>
    <td></td>`;
}

// ===================================================
renderBreedingProduction();
renderOtherProduction();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>उत्पादन (Year-wise)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:system-ui;background:#f4f7f6;margin:0}
.container{max-width:1500px;margin:20px auto;background:#fff;padding:24px;border-radius:12px}
h1{color:#2e7d32;margin-top:0}

table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}

input{width:100%;padding:6px}
.lock{background:#f1f8e9;font-weight:600}
button{padding:6px 12px;cursor:pointer}

.add{background:#2e7d32;color:#fff;border:none}
.del{background:#c62828;color:#fff;border:none}

/* PAGE FLOW */
.page-follow{
 position:fixed;right:14px;top:50%;
 transform:translateY(-50%);
 display:flex;flex-direction:column;gap:12px;z-index:999
}
.pf-btn{
 width:46px;height:46px;border-radius:50%;
 background:#2e7d32;color:#fff;
 display:flex;align-items:center;justify-content:center;
 text-decoration:none;font-size:22px
}
</style>
</head>

<body>

<div class="container">
<h1>📦 उत्पादन (Year-wise)</h1>

<table id="prod">
<thead>
<tr>
 <th>वर्ष</th>
 <th>उत्पादन नाम</th>
 <th>इकाई</th>
 <th>परिमाण</th>
 <th>कैफियत</th>
 <th>Action</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="add" onclick="addManual()">➕ अन्य उत्पादन थप्नुहोस्</button>
</div>

<!-- PAGE FLOW -->
<div class="page-follow">
 <a href="feed-vitamin-medicine-5yr.html" class="pf-btn">⬅️</a>
 <a href="expenses.demo.html" class="pf-btn">➡️</a>
</div>

<script>
// ================= LOAD BREEDING DATA =================
const breeding =
 JSON.parse(localStorage.getItem("BREEDING_ENGINE_5YR_RESULT")) || [];

// ================= LOAD MANUAL =================
let manual =
 JSON.parse(localStorage.getItem("MANUAL_PRODUCTION_5YR")) || [];

// ================= SAVE =================
function save(){
 localStorage.setItem("MANUAL_PRODUCTION_5YR", JSON.stringify(manual));
}

// ================= RENDER =================
function render(){
 const tb=document.querySelector("#prod tbody");
 tb.innerHTML="";

 // ---- AUTO BREEDING PRODUCTS ----
 breeding.forEach(y=>{
  const rows=[
   ["९–१२ भाले बिक्री",y.sold9M],
   ["९–१२ पोथी बिक्री",y.sold9F],
   ["बयस्क भाले बिक्री",y.soldAdultM],
   ["माउ बिक्री",y.soldAdultF]
  ];
  rows.forEach(r=>{
   const tr=document.createElement("tr");
   tr.innerHTML=`
    <td class="lock">Year ${y.year}</td>
    <td class="lock">${r[0]}</td>
    <td class="lock">जनावर</td>
    <td class="lock">${r[1]||0}</td>
    <td class="lock">Animal Breeding Engine बाट स्वचालित</td>
    <td class="lock">🔒</td>`;
   tb.appendChild(tr);
  });
 });

 // ---- MANUAL PRODUCTS (YEAR-WISE) ----
 manual.forEach((p,i)=>{
  const tr=document.createElement("tr");
  tr.innerHTML=`
   <td><input value="${p.year}" onchange="upd(${i},'year',this.value)"></td>
   <td><input value="${p.name}" onchange="upd(${i},'name',this.value)"></td>
   <td><input value="${p.unit}" onchange="upd(${i},'unit',this.value)"></td>
   <td><input type="number" value="${p.qty}" onchange="upd(${i},'qty',this.value)"></td>
   <td><input value="${p.note}" onchange="upd(${i},'note',this.value)"></td>
   <td><button class="del" onclick="del(${i})">🗑️</button></td>`;
  tb.appendChild(tr);
 });
}

// ================= CRUD =================
function addManual(){
 manual.push({year:"1",name:"",unit:"",qty:"",note:""});
 save(); render();
}
function upd(i,f,v){manual[i][f]=v;save();}
function del(i){
 if(confirm("हटाउने हो ?")){
  manual.splice(i,1);save();render();
 }
}

render();
</script>

</body>
</html>

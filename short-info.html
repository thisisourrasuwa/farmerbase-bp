<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Short Info | FarmerBase BP Engine</title>

<style>
body{
  font-family: Arial, Helvetica, sans-serif;
  background:#f5f5f5;
  margin:0;
}

header, footer{
  background:#2e7d32;
  color:#fff;
  padding:12px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h2{
  margin:0;
  font-size:22px;
}

.container{
  max-width:1100px;
  margin:20px auto;
  background:#fff;
  padding:25px;
  min-height:65vh;
}

h1{
  text-align:center;
  color:#2e7d32;
  margin-bottom:20px;
}

label{
  font-weight:600;
  display:block;
  margin-top:15px;
}

input, textarea, select{
  width:100%;
  padding:10px;
  margin-top:6px;
  font-size:16px;
}

textarea{resize:vertical}

/* Page Follow */
.page-follow{
  display:flex;
  justify-content:space-between;
  gap:20px;
  margin:35px 0 10px;
}

.page-follow button{
  flex:1;
  padding:14px;
  font-size:18px;
  font-weight:600;
  border:none;
  border-radius:6px;
  cursor:pointer;
  background:#2e7d32;
  color:#fff;
}

.page-follow button:hover{
  background:#1b5e20;
}

footer{
  font-size:14px;
}
</style>
</head>

<!-- START PAGE : only NEXT -->
<body data-next="existing-status.html">

<header>
  <h2>FarmerBase BP Engine</h2>
  <div>कृषकमैत्री व्यवसायिक योजना यन्त्र</div>
</header>

<div class="container">

<h1>Short Information</h1>

<label>व्यवसाय / परियोजनाको नाम</label>
<input type="text" placeholder="उदाहरण: बंगुर पालन फार्म">

<label>प्रस्तावक / उद्यमीको नाम</label>
<input type="text" placeholder="नाम लेख्नुहोस्">

<label>ठेगाना</label>
<input type="text" placeholder="गाउँ/नगरपालिका, जिल्ला">

<label>व्यवसायको प्रकार</label>
<select>
  <option value="">-- छान्नुहोस् --</option>
  <option>कृषि</option>
  <option>पशुपालन</option>
  <option>उद्योग</option>
  <option>सेवा</option>
  <option>अन्य</option>
</select>

<label>संक्षिप्त विवरण</label>
<textarea rows="4" placeholder="यस व्यवसायको छोटो परिचय लेख्नुहोस्"></textarea>

<!-- PAGE FOLLOW -->
<div class="page-follow">
  <button id="prevBtn"></button>
  <button id="nextBtn"></button>
</div>

</div>

<footer>
  <div>© FarmerBase BP Engine</div>
  <div>Step 1 of Business Plan</div>
</footer>

<script>
const pageMap = {
  "short-info.html": "Short Info",
  "existing-status.html": "Existing Status",
  "business-detail.html": "Business Detail",
  "capital-source.html": "Capital Source",
  "income.html": "Income",
  "expenses.html": "Expenses",
  "profit-loss.html": "Profit / Loss",
  "executive-summary.html": "Executive Summary"
};

const prevPage = document.body.dataset.prev;
const nextPage = document.body.dataset.next;

const prevBtn = document.getElementById("prevBtn");
const nextBtn = document.getElementById("nextBtn");

if(prevPage){
  prevBtn.textContent = "Preview : " + pageMap[prevPage];
  prevBtn.onclick = () => location.href = prevPage;
}else{
  prevBtn.style.display = "none";
}

if(nextPage){
  nextBtn.textContent = "Next : " + pageMap[nextPage];
  nextBtn.onclick = () => location.href = nextPage;
}else{
  nextBtn.style.display = "none";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Short Info</title>

<style>
body{
 font-family:Arial, sans-serif;
 background:#f5f5f5;
 margin:0
}
header,footer{
 background:#2e7d32;
 color:#fff;
 padding:16px 20px;
 display:flex;
 justify-content:center;
 align-items:center
}
.container{
 max-width:1100px;
 margin:auto;
 background:#fff;
 padding:20px;
 min-height:70vh
}
h1{
 text-align:center;
 font-size:32px;
 color:#2e7d32;
 margin:15px 0 25px
}
h2{
 color:#333;
 border-bottom:2px solid #e0e0e0;
 padding-bottom:5px;
 margin-top:25px
}
label{
 display:block;
 margin-top:12px;
 font-weight:bold
}
input, textarea, select{
 width:100%;
 padding:8px;
 margin-top:5px;
 box-sizing:border-box
}
textarea{resize:vertical;min-height:90px}
.note{
 font-size:13px;
 color:#555;
 margin-top:15px
}

/* ===== PAGE FOLLOW (SUMMARY STYLE) ===== */
.page-follow{
 display:flex;
 justify-content:space-between;
 gap:20px;
 margin:35px 0 10px
}
.page-follow button{
 flex:1;
 padding:14px;
 font-size:18px;
 font-weight:600;
 border:none;
 border-radius:6px;
 cursor:pointer;
 background:#2e7d32;
 color:#fff
}
.page-follow button:hover{
 background:#1b5e20
}
</style>
</head>

<!-- START PAGE -->
<body data-next="production.html">

<header>
  <h2>FarmerBase BP Engine</h2>
</header>

<div class="container">

<h2>१. व्यवसाय परिचय</h2>

<label>व्यवसाय / फर्मको नाम</label>
<input id="firmName" placeholder="फर्मको नाम">

<label>परियोजनाको नाम</label>
<input id="projectName" placeholder="उदाहरण: व्यावसायिक तरकारी खेती">

<label>व्यवसायको क्षेत्र</label>
<select id="bizSector">
 <option value="">छान्नुहोस्</option>
 <option>कृषि</option>
 <option>पशुपालन</option>
 <option>सेवा</option>
 <option>उत्पादन</option>
 <option>अन्य</option>
</select>

<label>व्यवसायको स्वरूप</label>
<select id="bizStage">
 <option value="">छान्नुहोस्</option>
 <option>नयाँ व्यवसाय</option>
 <option>विद्यमान व्यवसायको विस्तार</option>
</select>

<h2>२. स्थान र दायरा</h2>

<label>व्यवसायको स्थान</label>
<input id="location" placeholder="गाउँ/नगरपालिका, जिल्ला">

<label>सेवा / बजार क्षेत्र</label>
<input id="marketArea" placeholder="स्थानीय / जिल्ला / प्रदेश / राष्ट्रिय">

<h2>३. संचालक / प्रवर्तक</h2>

<label>संचालकको नाम</label>
<input id="promoter">

<label>अनुभव (वर्षमा)</label>
<input type="number" id="experience" placeholder="उदाहरण: 5">

<h2>४. कानुनी दर्ता तथा आवद्धता</h2>

<label>व्यवसाय दर्ता स्थिति</label>
<select id="registrationStatus">
 <option value="">छान्नुहोस्</option>
 <option>दर्ता भइसकेको</option>
 <option>दर्ता प्रक्रियामा</option>
 <option>दर्ता गर्न बाँकी</option>
</select>

<label>दर्ता निकाय</label>
<input id="registrationAuthority">

<label>दर्ता नं</label>
<input id="registrationNumber">

<label>PAN / VAT नं</label>
<input id="panNumber">

<label>अन्य आवद्धता / सदस्यता</label>
<textarea id="affiliation"></textarea>

<h2>५. उद्देश्य र लक्ष्य</h2>

<label>मुख्य उद्देश्य</label>
<textarea id="objective"></textarea>

<label>लक्षित ग्राहक / बजार</label>
<textarea id="targetMarket"></textarea>

<h2>६. कार्यकारी सारांश</h2>
<textarea id="summary"></textarea>

<p class="note">
✔️ यो पेज बैंक, अनुदान तथा सरकारी निकायले सबैभन्दा पहिले हेर्छन् ।
</p>

<!-- ===== PAGE FOLLOW ===== -->
<div class="page-follow">
  <button id="prevBtn"></button>
  <button id="nextBtn"></button>
</div>

</div>

<footer>
  FarmerBase BP Engine – Short Info
</footer>

<script>
/* ===== PAGE FOLLOW LOGIC ===== */
const pageMap={
 "short-info.html":"Short Info",
 "production.html":"Production Detail"
};

const prev=document.body.dataset.prev;
const next=document.body.dataset.next;

const pBtn=document.getElementById("prevBtn");
const nBtn=document.getElementById("nextBtn");

if(prev){
 pBtn.textContent="Preview : "+pageMap[prev];
 pBtn.onclick=()=>location.href=prev;
}else pBtn.style.display="none";

if(next){
 nBtn.textContent="Next : "+pageMap[next];
 nBtn.onclick=()=>location.href=next;
}else nBtn.style.display="none";

/* ===== EXISTING AUTO LOGIC (UNCHANGED) ===== */
const activeId=localStorage.getItem("activeBusinessId");
const list=JSON.parse(localStorage.getItem("businessList"))||[];
const biz=list.find(b=>b.id===activeId);

if(biz){
 firmName.value=biz.name||"";
 promoter.value=biz.proprietor||"";
}

[
 "firmName","projectName","bizSector","bizStage",
 "location","marketArea","promoter","experience",
 "registrationStatus","registrationAuthority",
 "registrationNumber","panNumber","affiliation",
 "objective","targetMarket","summary"
].forEach(id=>{
 const el=document.getElementById(id);
 el.value=el.value||localStorage.getItem(id)||"";
 el.onchange=()=>localStorage.setItem(id,el.value);
});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>FarmerBase BP Engine</title>

<style>
body{
 font-family:Arial;
 background:#f4f6f8;
 margin:0
}
header,footer{
 background:#2e7d32;
 color:#fff;
 padding:14px 20px;
 display:flex;
 justify-content:space-between;
 align-items:center
}
header h1{
 font-size:20px;
 margin:0
}
.container{
 max-width:1200px;
 margin:auto;
 padding:20px
}

.btn{
 padding:8px 14px;
 border:none;
 cursor:pointer;
 border-radius:4px;
 font-size:14px
}
.add{background:#2e7d32;color:#fff}
.open{background:#0277bd;color:#fff}
.del{background:#c62828;color:#fff}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fill,minmax(280px,1fr));
 gap:16px
}

.card{
 background:#fff;
 border-radius:6px;
 padding:16px;
 box-shadow:0 2px 6px rgba(0,0,0,.08)
}

.card h3{
 margin:0 0 8px;
 color:#2e7d32
}

.meta{
 font-size:13px;
 color:#555;
 margin-bottom:10px
}

.actions{
 display:flex;
 justify-content:space-between;
 margin-top:10px
}

.empty{
 text-align:center;
 padding:60px 20px;
 color:#777
}
</style>
</head>

<body>

<header>
 <h1>🌱 FarmerBase BP Engine</h1>
 <button class="btn add" onclick="createNew()">
  ➕ नयाँ व्यवसाय बनाउनुहोस्
 </button>
</header>

<div class="container">

<h2>📂 मेरा व्यवसायहरू</h2>

<div id="list" class="grid"></div>

<div id="empty" class="empty" style="display:none">
 <p>अहिलेसम्म कुनै व्यवसाय सिर्जना गरिएको छैन।</p>
 <button class="btn add" onclick="createNew()">
  ➕ पहिलो व्यवसाय बनाउनुहोस्
 </button>
</div>

</div>

<footer>
 <span>FarmerBase BP Engine – कृषकमैत्री व्यवसाय योजना प्रणाली</span>
</footer>

<script>
/* ================= LOAD BUSINESS LIST ================= */
let businessList =
 JSON.parse(localStorage.getItem("businessList")) || [];

/* ===== BACKWARD COMPATIBILITY (one-time migrate) ===== */
const single =
 JSON.parse(localStorage.getItem("businessProfile"));

if(single){
 const exists = businessList.find(b=>b.id===single.id);
 if(!exists){
  businessList.push(single);
  localStorage.setItem("businessList",JSON.stringify(businessList));
 }
}

/* ================= RENDER ================= */
function render(){
 const box=document.getElementById("list");
 const empty=document.getElementById("empty");

 box.innerHTML="";

 if(businessList.length===0){
  empty.style.display="block";
  return;
 }
 empty.style.display="none";

 businessList
  .sort((a,b)=>(b.updatedAt||b.createdAt)-(a.updatedAt||a.createdAt))
  .forEach(b=>{
   const div=document.createElement("div");
   div.className="card";
   div.innerHTML=`
<h3>${b.name||"नाम नदिइएको व्यवसाय"}</h3>
<div class="meta">
 📍 ${b.location||"ठेगाना छैन"}<br>
 🕒 ${
  b.updatedAt
   ? "अन्तिम संशोधन: "+new Date(b.updatedAt).toLocaleString()
   : "सिर्जना: "+new Date(b.createdAt).toLocaleString()
 }
</div>

<div class="actions">
 <button class="btn open"
  onclick="openBusiness('${b.id}')">
  खोल्नुहोस्
 </button>
 <button class="btn del"
  onclick="deleteBusiness('${b.id}')">
  हटाउनुहोस्
 </button>
</div>`;
   box.appendChild(div);
  });
}

/* ================= ACTIONS ================= */
function createNew(){
 window.location.href="business-create.html";
}

function openBusiness(id){
 localStorage.setItem("activeBusinessId",id);
 window.location.href="production.html";
}

function deleteBusiness(id){
 if(!confirm("यो व्यवसाय हटाउने हो ?")) return;
 businessList = businessList.filter(b=>b.id!==id);
 localStorage.setItem("businessList",JSON.stringify(businessList));
 render();
}

/* ================= INIT ================= */
render();
</script>

</body>
</html>

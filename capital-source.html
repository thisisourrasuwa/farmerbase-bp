<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Capital Source</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header,footer{
 background:#2e7d32;color:#fff;
 padding:12px 20px;
 display:flex;justify-content:space-between;align-items:center
}
header a,footer a{color:#fff;text-decoration:none;font-weight:bold}

.container{
 max-width:1200px;margin:auto;background:#fff;
 padding:20px;min-height:70vh
}

.summary{
 background:#f1f8e9;padding:15px;margin-bottom:20px;
 font-size:15px
}

select,input{padding:5px;margin-left:5px}

table{width:100%;border-collapse:collapse}
th,td{
 border:1px solid #ccc;padding:8px;text-align:center
}
th{background:#e8f5e9}

td input{width:100%;box-sizing:border-box}

.btn{padding:6px 12px;border:none;cursor:pointer}
.add{background:#2e7d32;color:#fff}
.del{background:#c62828;color:#fff}

.ok{color:#2e7d32;font-weight:bold}
.warn{color:#c62828;font-weight:bold}
</style>
</head>

<body>

<header>
 <a href="expense-demo.html">⬅️ खर्च विवरण</a>
 <span>पुँजिको स्रोत</span>
 <a href="income-demo.html">आम्दानी विवरण ➡️</a>
</header>

<div class="container">

<!-- ================= SUMMARY ================= -->
<div class="summary">

<b>स्थिर पूँजी:</b> <span id="fixedCap">0</span><br>
<b>वार्षिक चालु खर्च:</b> <span id="annualVar">0</span><br><br>

<b>कार्यशील पूँजी मोड:</b>
<select id="wcMode" onchange="changeWCMode(this.value)">
 <option value="months">महिना आधारित</option>
 <option value="percent">प्रतिशत आधारित</option>
 <option value="manual">Manual</option>
</select>

<span id="wcOptions"></span>

<hr>

<b>कार्यशील पूँजी:</b> <span id="workingCap">0</span><br>
<b>कुल आवश्यक पूँजी:</b> <span id="totalCapital">0</span><br>
<b>कुल %:</b> <span id="totalPercent">0%</span>
<span id="status"></span>

</div>

<!-- ================= SOURCE TABLE ================= -->
<table>
<thead>
<tr>
 <th>स्रोत</th>
 <th>%</th>
 <th>रकम (Auto)</th>
 <th>🗑️</th>
</tr>
</thead>
<tbody id="capBody"></tbody>
</table>

<button class="btn add" onclick="addSource()">➕ स्रोत थप्नुहोस्</button>

</div>

<footer>
 <span>FarmerBase BP Engine – Capital Source</span>
</footer>

<script>
/* =================================================
   LOAD FROM EXPENSES (FINAL CONTRACT)
================================================= */
const annualVar =
 Number(localStorage.getItem("variable_annual_cost")) || 0;

const fixedCap =
 Number(localStorage.getItem("fixed_total_capital")) || 0;

/* =================================================
   WORKING CAPITAL STATE (AUTO LOAD)
================================================= */
let wcState =
 JSON.parse(localStorage.getItem("wcState")) || {
  mode: "months",
  months: 3,
  percent: 20,
  manual: 0
 };

function saveWC(){
 localStorage.setItem("wcState", JSON.stringify(wcState));
}

function changeWCMode(mode){
 wcState.mode = mode;
 saveWC();
 render();
}

/* =================================================
   CAPITAL SOURCES (% driven)
================================================= */
let sources =
 JSON.parse(localStorage.getItem("capitalSources")) || [];

function saveSources(){
 localStorage.setItem("capitalSources", JSON.stringify(sources));
}

function addSource(){
 sources.push({id:Date.now(),name:"",pct:0});
 saveSources(); render();
}

function updateSource(id,field,val){
 const s = sources.find(x=>x.id===id);
 s[field] = field==="pct" ? Number(val)||0 : val;
 saveSources(); render();
}

function removeSource(id){
 if(confirm("हटाउने हो ?")){
  sources = sources.filter(s=>s.id!==id);
  saveSources(); render();
 }
}

/* =================================================
   WORKING CAPITAL CALC
================================================= */
function calcWorkingCap(){
 if(wcState.mode==="months"){
  return (annualVar/12) * (wcState.months || 3);
 }
 if(wcState.mode==="percent"){
  return annualVar * (wcState.percent || 0) / 100;
 }
 if(wcState.mode==="manual"){
  return wcState.manual || 0;
 }
 return 0;
}

/* =================================================
   RENDER
================================================= */
function render(){
 document.getElementById("fixedCap").innerText =
  fixedCap.toFixed(2);
 document.getElementById("annualVar").innerText =
  annualVar.toFixed(2);

 /* restore wcMode */
 const modeSel = document.getElementById("wcMode");
 modeSel.value = wcState.mode;

 /* wcOptions */
 let opt = "";
 if(wcState.mode==="months"){
  opt = ` महिना:
  <select onchange="
    wcState.months=this.value;
    saveWC();render()">
   <option value="3" ${wcState.months==3?"selected":""}>3</option>
   <option value="6" ${wcState.months==6?"selected":""}>6</option>
   <option value="9" ${wcState.months==9?"selected":""}>9</option>
   <option value="12" ${wcState.months==12?"selected":""}>12</option>
  </select>`;
 }
 if(wcState.mode==="percent"){
  opt = ` %:
  <input type="number" value="${wcState.percent}"
   onchange="
    wcState.percent=this.value;
    saveWC();render()"
   style="width:80px">`;
 }
 if(wcState.mode==="manual"){
  opt = ` रकम:
  <input type="number" value="${wcState.manual}"
   onchange="
    wcState.manual=this.value;
    saveWC();render()"
   style="width:120px">`;
 }

 document.getElementById("wcOptions").innerHTML = opt;

 const workingCap = calcWorkingCap();
 const totalCapital = fixedCap + workingCap;

 document.getElementById("workingCap").innerText =
  workingCap.toFixed(2);
 document.getElementById("totalCapital").innerText =
  totalCapital.toFixed(2);

 /* table */
 const tb = document.getElementById("capBody");
 tb.innerHTML = "";
 let sumPct = 0;

 sources.forEach(s=>{
  sumPct += s.pct;
  const amt = totalCapital * s.pct / 100;

  tb.innerHTML += `
<tr>
<td>
 <input value="${s.name}"
  onchange="updateSource(${s.id},'name',this.value)">
</td>
<td>
 <input type="number" value="${s.pct}"
  onchange="updateSource(${s.id},'pct',this.value)">
</td>
<td>${amt.toFixed(2)}</td>
<td>
 <button class="btn del"
  onclick="removeSource(${s.id})">🗑️</button>
</td>
</tr>`;
 });

 document.getElementById("totalPercent").innerText =
  sumPct + "%";

 document.getElementById("status").innerHTML =
  sumPct===100
   ?'<span class="ok"> ✔️ 100% मिल्यो</span>'
   :'<span class="warn"> ❗ 100% हुनुपर्छ</span>';
}

render();
</script>

</body>
</html>

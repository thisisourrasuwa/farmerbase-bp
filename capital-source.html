<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Capital Source</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header,footer{
 background:#2e7d32;color:#fff;padding:12px 20px;
 display:flex;justify-content:space-between;align-items:center
}
header a,footer a{color:#fff;text-decoration:none;font-weight:bold}

.container{
 max-width:1200px;
 margin:auto;
 background:#fff;
 padding:20px;
 min-height:70vh
}

.summary{
 background:#f1f8e9;
 padding:15px;
 margin-bottom:20px;
 font-size:15px
}

select,input{padding:5px;margin-left:5px}

table{
 width:100%;
 border-collapse:collapse;
 table-layout:fixed
}
th,td{
 border:1px solid #ccc;
 padding:8px;
 text-align:center;
 font-size:14px
}
th{background:#e8f5e9}

.col-name{width:320px}
.col-amount{width:200px}
.col-percent{width:150px}
.col-action{width:80px}

td input{width:100%;box-sizing:border-box}

.btn{padding:6px 12px;border:none;cursor:pointer}
.add{background:#2e7d32;color:#fff}
.del{background:#c62828;color:#fff}

.warn{color:#c62828;font-weight:bold}
.ok{color:#2e7d32;font-weight:bold}
</style>
</head>

<body>

<header>
 <a href="expense-demo.html">⬅️ खर्च विवरण</a>
 <span>पुँजिको स्रोत</span>
 <a href="income-demo.html">आम्दानी विवरण ➡️</a>
</header>

<div class="container">

<!-- ================= SUMMARY ================= -->
<div class="summary">
<b>स्थिर पूँजी:</b> <span id="fixedCap">0</span><br>
<b>वार्षिक चालु खर्च:</b> <span id="annualVar">0</span><br><br>

<b>कार्यशील पूँजी मोड:</b>
<select id="wcMode" onchange="render()">
 <option value="months">महिना आधारित</option>
 <option value="percent">प्रतिशत आधारित</option>
 <option value="manual">Manual</option>
</select>

<span id="wcOptions"></span>

<hr>

<b>कार्यशील पूँजी:</b> <span id="workingCap">0</span><br>
<b>कुल आवश्यक पूँजी:</b> <span id="totalCapital">0</span><br>
<b>कुल स्रोत रकम:</b> <span id="totalSource">0</span><br>
<b>कुल %:</b> <span id="totalPercent">0%</span>
<span id="status"></span>
</div>

<!-- ================= TABLE ================= -->
<table>
<thead>
<tr>
 <th class="col-name">स्रोत / विवरण</th>
 <th class="col-amount">रकम</th>
 <th class="col-percent">%</th>
 <th class="col-action">🗑️</th>
</tr>
</thead>
<tbody id="capBody"></tbody>
</table>

<button class="btn add" onclick="addSource()">➕ स्रोत थप्नुहोस्</button>
</div>

<footer>
 <a href="expense-demo.html">⬅️ खर्च विवरण</a>
 <span>FarmerBase BP Engine – Capital Source</span>
 <a href="income-demo.html">आम्दानी विवरण ➡️</a>
</footer>

<script>
/* ================= SAFE LOAD (SINGLE SOURCE OF TRUTH) ================= */
const fbData =
 JSON.parse(localStorage.getItem("farmerBaseData")) || {};

let varExp = fbData.varExp || [];
let fixExp = fbData.fixExp || [];
let sources = fbData.capitalSources || [];

/* ================= CALC ================= */
function fixedCapital(){
 return fixExp.reduce((s,e)=>s+(e.qty*e.rate||0),0);
}

function annualVariable(){
 return varExp.reduce((s,e)=>s+(e.qty*e.rate||0),0);
}

/* ================= SAVE (CRITICAL FIX) ================= */
function save(){
 const data =
  JSON.parse(localStorage.getItem("farmerBaseData")) || {};

 data.capitalSources = sources;

 localStorage.setItem(
  "farmerBaseData",
  JSON.stringify(data)
 );
}

/* ================= CRUD ================= */
function addSource(){
 sources.push({
  id:"c"+Date.now(),
  name:"",
  narration:"",
  amount:0
 });
 save(); render();
}

function update(id,f,v){
 const s=sources.find(x=>x.id===id);
 s[f]=f==="amount"?Number(v)||0:v;
 save(); render();
}

function removeSource(id){
 if(confirm("हटाउने हो ?")){
  sources=sources.filter(s=>s.id!==id);
  save(); render();
 }
}

/* ================= WORKING CAPITAL ================= */
function calcWorkingCap(annual){
 const mode=document.getElementById("wcMode").value;

 if(mode==="months"){
  const m=Number(document.getElementById("wcMonths")?.value)||3;
  return (annual/12)*m;
 }

 if(mode==="percent"){
  const p=Number(document.getElementById("wcPercent")?.value)||0;
  return annual*p/100;
 }

 if(mode==="manual"){
  return Number(document.getElementById("wcManual")?.value)||0;
 }

 return 0;
}

/* ================= RENDER ================= */
function render(){
 const fixed=fixedCapital();
 const annual=annualVariable();

 document.getElementById("fixedCap").innerText=fixed.toFixed(2);
 document.getElementById("annualVar").innerText=annual.toFixed(2);

 const mode=document.getElementById("wcMode").value;
 let opt="";

 if(mode==="months"){
  opt=` महिना:
  <select id="wcMonths" onchange="render()">
   <option>3</option><option>6</option>
   <option>9</option><option>12</option>
  </select>`;
 }
 if(mode==="percent"){
  opt=` %:
  <input type="number" id="wcPercent" value="20"
   onchange="render()" style="width:80px">`;
 }
 if(mode==="manual"){
  opt=` रकम:
  <input type="number" id="wcManual"
   onchange="render()" style="width:120px">`;
 }

 document.getElementById("wcOptions").innerHTML=opt;

 const working=calcWorkingCap(annual);
 const totalCap=fixed+working;

 document.getElementById("workingCap").innerText=working.toFixed(2);
 document.getElementById("totalCapital").innerText=totalCap.toFixed(2);

 const tb=document.getElementById("capBody");
 tb.innerHTML="";

 const totalSrc=sources.reduce((s,x)=>s+(x.amount||0),0);

 sources.forEach(s=>{
  const pct=totalCap?((s.amount/totalCap)*100).toFixed(1):"0";

  tb.innerHTML+=`
<tr>
<td>
 <input value="${s.name}" placeholder="स्रोत नाम"
  onchange="update('${s.id}','name',this.value)">
 <br>
 <input value="${s.narration||''}" placeholder="न्यारेसन / विवरण"
  onchange="update('${s.id}','narration',this.value)"
  style="margin-top:4px;font-size:12px">
</td>

<td>
 <input type="number" value="${s.amount}"
  onchange="update('${s.id}','amount',this.value)">
</td>

<td>${pct}%</td>

<td>
 <button class="btn del"
  onclick="removeSource('${s.id}')">🗑️</button>
</td>
</tr>`;
 });

 document.getElementById("totalSource").innerText=totalSrc.toFixed(2);

 const pct=totalCap?((totalSrc/totalCap)*100).toFixed(1):"0";
 document.getElementById("totalPercent").innerText=pct+"%";

 document.getElementById("status").innerHTML=
  pct==100
   ?'<span class="ok"> ✔️ मिल्यो</span>'
   :'<span class="warn"> ❗ 100% हुनुपर्छ</span>';
}

render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Capital Source</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header,footer{
 background:#2e7d32;color:#fff;
 padding:12px 20px;
 display:flex;justify-content:space-between;align-items:center
}
header a,footer a{color:#fff;text-decoration:none;font-weight:bold}

.container{
 max-width:1250px;margin:auto;background:#fff;
 padding:20px;min-height:70vh
}

.summary{
 background:#f1f8e9;padding:15px;margin-bottom:20px;
 font-size:15px
}

select,input{padding:5px}

table{width:100%;border-collapse:collapse}
th,td{
 border:1px solid #ccc;padding:8px;text-align:center;
 font-size:14px
}
th{background:#e8f5e9}

td input{width:100%;box-sizing:border-box}

.btn{padding:6px 12px;border:none;cursor:pointer}
.add{background:#2e7d32;color:#fff}
.del{background:#c62828;color:#fff}

.ok{color:#2e7d32;font-weight:bold}
.warn{color:#c62828;font-weight:bold}
</style>
</head>

<body>

<header>
 <a href="expense-demo.html">⬅️ खर्च विवरण</a>
 <span>पुँजिको स्रोत</span>
 <a href="income-demo.html">आम्दानी विवरण ➡️</a>
</header>

<div class="container">

<div class="summary">
<b>स्थिर पूँजी:</b> <span id="fixedCap">0</span><br>
<b>वार्षिक चालु खर्च:</b> <span id="annualVar">0</span><br>
<b>कार्यशील पूँजी:</b> <span id="workingCap">0</span><br>
<hr>
<b>कुल आवश्यक पूँजी:</b> <span id="totalCapital">0</span><br>
<b>कुल %:</b> <span id="totalPercent">0%</span>
<span id="status"></span><br>
<b>वार्षिक ब्याज खर्च:</b> <span id="totalInterest">0</span>
</div>

<table>
<thead>
<tr>
 <th>स्रोत प्रकार</th>
 <th>स्रोत नाम</th>
 <th>%</th>
 <th>रकम (Auto)</th>
 <th>ब्याज %</th>
 <th>वार्षिक ब्याज</th>
 <th>🗑️</th>
</tr>
</thead>
<tbody id="capBody"></tbody>
</table>

<button class="btn add" onclick="addSource()">➕ स्रोत थप्नुहोस्</button>

</div>

<footer>
 <span>FarmerBase BP Engine – Capital Source</span>
</footer>

<script>
/* ===== LOAD FROM EXPENSES ===== */
const annualVar = parseFloat(localStorage.getItem("variable_annual_cost")) || 0;
const fixedCap  = parseFloat(localStorage.getItem("fixed_total_capital")) || 0;

/* ===== WORKING CAPITAL (simple: 3 months) ===== */
const workingCap = (annualVar/12)*3;
const totalCapital = fixedCap + workingCap;

/* ===== SOURCES ===== */
let sources = JSON.parse(localStorage.getItem("capitalSources")) || [];

function saveSources(){
 localStorage.setItem("capitalSources", JSON.stringify(sources));
}

function addSource(){
 sources.push({
  id:Date.now(),
  type:"self",
  name:"",
  pct:0,
  interest:0
 });
 saveSources(); render();
}

function update(id,field,val){
 const s = sources.find(x=>x.id===id);

 if(field==="name"){
  s.name = val;                 // keep string
 }else{
  s[field] = parseFloat(val) || 0; // safe number
 }
 saveSources(); render();
}

function removeSource(id){
 if(confirm("हटाउने हो ?")){
  sources = sources.filter(s=>s.id!==id);
  saveSources(); render();
 }
}

/* ===== RENDER ===== */
function render(){
 document.getElementById("fixedCap").innerText = fixedCap.toFixed(2);
 document.getElementById("annualVar").innerText = annualVar.toFixed(2);
 document.getElementById("workingCap").innerText = workingCap.toFixed(2);
 document.getElementById("totalCapital").innerText = totalCapital.toFixed(2);

 const tb = document.getElementById("capBody");
 tb.innerHTML = "";

 let sumPct = 0;
 let totalInterest = 0;

 sources.forEach(s=>{
  const pct = parseFloat(s.pct) || 0;
  const amt = totalCapital * pct / 100;

  const interestAmt =
   (s.type==="loan" || s.type==="other")
    ? amt * (parseFloat(s.interest)||0) / 100
    : 0;

  sumPct += pct;
  totalInterest += interestAmt;

  tb.innerHTML += `
<tr>
<td>
 <select onchange="update(${s.id},'type',this.value)">
  <option value="self" ${s.type==="self"?"selected":""}>स्वलगानी</option>
  <option value="grant" ${s.type==="grant"?"selected":""}>अनुदान</option>
  <option value="loan" ${s.type==="loan"?"selected":""}>बैंक/सहकारी ऋण</option>
  <option value="other" ${s.type==="other"?"selected":""}>अन्य</option>
 </select>
</td>
<td>
 <input value="${s.name}"
  oninput="update(${s.id},'name',this.value)">
</td>
<td>
 <input type="number" value="${pct}"
  oninput="update(${s.id},'pct',this.value)">
</td>
<td>${amt.toFixed(2)}</td>
<td>
 <input type="number" value="${s.interest}"
  ${s.type==="loan"||s.type==="other"?"":"disabled"}
  oninput="update(${s.id},'interest',this.value)">
</td>
<td>${interestAmt.toFixed(2)}</td>
<td>
 <button class="btn del"
  onclick="removeSource(${s.id})">🗑️</button>
</td>
</tr>`;
 });

 document.getElementById("totalPercent").innerText = sumPct + "%";
 document.getElementById("totalInterest").innerText = totalInterest.toFixed(2);

 document.getElementById("status").innerHTML =
  sumPct===100
   ?'<span class="ok"> ✔️ 100% मिल्यो</span>'
   :'<span class="warn"> ❗ 100% हुनुपर्छ</span>';

 /* send interest to profit-loss */
 localStorage.setItem(
  "annual_interest_cost",
  totalInterest.toFixed(2)
 );
}

render();
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>पुँजिको स्रोत</title>

<style>
body{
 font-family:Arial, sans-serif;
 background:#f5f5f5;
 margin:0
}

/* ===== HEADER (PAGE NAME ONLY) ===== */
header{
 background:#2e7d32;
 color:#fff;
 padding:18px 20px;
 text-align:center;
 font-size:22px;
 font-weight:700;
 letter-spacing:.4px;
 box-shadow:0 2px 6px rgba(0,0,0,0.2)
}

/* ===== SIDE PAGE FOLLOW ===== */
.side-nav{
 position:fixed;
 top:50%;
 transform:translateY(-50%);
 width:48px;
 height:48px;
 border-radius:50%;
 background:#2e7d32;
 color:#fff;
 font-size:26px;
 display:flex;
 align-items:center;
 justify-content:center;
 cursor:pointer;
 z-index:999;
 box-shadow:0 4px 10px rgba(0,0,0,.25)
}
.side-nav.prev{left:15px}
.side-nav.next{right:15px}
.side-nav:hover{background:#1b5e20}

/* ===== PAGE BODY ===== */
.container{
 max-width:1100px;
 margin:auto;
 background:#fff;
 padding:20px 70px;   /* side safe zone */
 min-height:70vh
}

h2{
 margin-top:30px;
 color:#2e7d32
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:15px
}

th,td{
 border:1px solid #ccc;
 padding:10px;
 text-align:center;
 font-size:15px
}

th{
 background:#e8f5e9
}

input{
 width:100%;
 padding:6px;
 box-sizing:border-box
}

.btn{
 padding:6px 12px;
 border:none;
 cursor:pointer;
 font-size:14px
}

.add{
 background:#2e7d32;
 color:#fff
}

.del{
 background:#c62828;
 color:#fff
}

footer{
 background:#2e7d32;
 color:#fff;
 padding:12px 20px;
 text-align:center;
 font-size:14px
}
</style>
</head>

<body>

<!-- ===== SIDE NAVIGATION ===== -->
<div class="side-nav prev" onclick="location.href='expense-demo.html'">⬅</div>
<div class="side-nav next" onclick="location.href='income.html'">➡</div>

<!-- ===== HEADER ===== -->
<header>
  पुँजिको स्रोत
</header>

<div class="container">

<h2>१. पुँजीको विवरण</h2>

<table id="capitalTable">
<thead>
<tr>
 <th>पुँजीको स्रोत</th>
 <th>रकम</th>
 <th>कैफियत</th>
 <th>🗑️</th>
</tr>
</thead>
<tbody></tbody>
</table>

<button class="btn add" onclick="addCapital()">➕ पुँजी स्रोत थप्नुहोस्</button>

</div>

<footer>
 FarmerBase BP Engine
</footer>

<script>
/* ===== SAFE & SIMPLE CAPITAL LOGIC ===== */
let capitals = JSON.parse(localStorage.getItem("capitals")) || [];

function save(){
 localStorage.setItem("capitals", JSON.stringify(capitals));
}

function render(){
 const tbody = document.querySelector("#capitalTable tbody");
 tbody.innerHTML = "";

 let total = 0;

 capitals.forEach((c, i)=>{
  total += +c.amount || 0;

  const tr = document.createElement("tr");
  tr.innerHTML = `
<td><input value="${c.source}" onchange="update(${i},'source',this.value)"></td>
<td><input type="number" value="${c.amount}" onchange="update(${i},'amount',this.value)"></td>
<td><input value="${c.note}" onchange="update(${i},'note',this.value)"></td>
<td><button class="btn del" onclick="removeCapital(${i})">🗑️</button></td>
`;
  tbody.appendChild(tr);
 });

 localStorage.setItem("total_capital", total.toFixed(2));
}

function addCapital(){
 capitals.push({source:"", amount:0, note:""});
 save(); render();
}

function update(i, key, val){
 capitals[i][key] = val;
 save();
}

function removeCapital(i){
 if(confirm("यो पुँजी स्रोत हटाउने हो ?")){
  capitals.splice(i,1);
  save(); render();
 }
}

render();
</script>

</body>
</html>

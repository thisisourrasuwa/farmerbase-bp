<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Animal Breeding Engine | FarmerBase BP Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:"Noto Sans Devanagari","Kalimati",system-ui;
  background:#f4f7f6;margin:0
}
.container{
  max-width:1200px;margin:20px auto;
  background:#fff;padding:22px;border-radius:12px
}
h1,h2{color:#2e7d32;margin-top:0}
.small{font-size:13px;color:#555}
table{width:100%;border-collapse:collapse;margin-top:12px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}
input{width:100%;padding:6px}
button{
  padding:10px 18px;
  background:#2e7d32;color:#fff;
  border:none;border-radius:6px;
  cursor:pointer
}
strong{color:#1b5e20}
</style>
</head>

<body>
<div class="container">

<h1>🐷 Animal Breeding Engine</h1>
<p class="small">
उमेर समूह × लिङ्ग आधारित ५ वर्षे प्रजनन गणना (Rotation Model)
</p>

<!-- INPUT -->
<h2>🔢 प्रारम्भिक इनपुट</h2>
<table>
<tr><td>प्रारम्भिक प्रजननयोग्य माउ</td><td><input id="adultFemale" value="100"></td></tr>
<tr><td>एक माउले वार्षिक जन्माउने बच्चा</td><td><input id="kidsPerFemale" value="20"></td></tr>
<tr><td>व्याउने दर (%)</td><td><input id="breedRate" value="90"></td></tr>
<tr><td>मृत्युदर (%)</td><td><input id="deathRate" value="10"></td></tr>
</table>

<h2 style="margin-top:25px">📤 बिक्री नियम (%)</h2>
<table>
<tr>
  <th></th>
  <th>१–३ महिना</th>
  <th>४–६ महिना</th>
  <th>७–१० महिना</th>
</tr>
<tr>
  <td>भाले</td>
  <td><input id="sale_m_A1" value="30"></td>
  <td><input id="sale_m_A2" value="40"></td>
  <td><input id="sale_m_A3" value="30"></td>
</tr>
<tr>
  <td>पोथी</td>
  <td><input id="sale_f_A1" value="10"></td>
  <td><input id="sale_f_A2" value="20"></td>
  <td><input id="sale_f_A3" value="10"></td>
</tr>
</table>

<br>
<button onclick="runEngine()">⚙️ Run Breeding Engine (5 Years)</button>

<hr>

<h2>📊 ५ वर्षे नतिजा</h2>
<div id="result"></div>

</div>

<script>
/* ================= UTIL ================= */
function n(id){
  return Number(document.getElementById(id).value) || 0;
}
function sale(count, percent){
  const sold = Math.round(count * percent / 100);
  return { sold, remain: count - sold };
}

/* ================= CORE ENGINE ================= */
function runEngine(){

  const kids = n("kidsPerFemale");
  const breedRate = n("breedRate")/100;
  const deathRate = n("deathRate")/100;

  let breedingFemale = n("adultFemale"); // 🔒 माउ
  let breedingMale = 0;                  // 🔒 प्रजनन्का लागि भाले

  let yearly = [];

  for(let year=1; year<=5; year++){

    /* ---- Birth (female only) ---- */
    const born = breedingFemale * kids * breedRate;
    const survived = born * (1 - deathRate);

    const maleBorn = Math.round(survived/2);
    const femaleBorn = Math.round(survived/2);

    /* ---- SALE BASE ---- */
    const saleBaseMale = maleBorn + breedingMale;
    const saleBaseFemale = femaleBorn;

    /* ---- Male sale slabs ---- */
    const m1 = sale(saleBaseMale, n("sale_m_A1"));
    const m2 = sale(m1.remain, n("sale_m_A2"));
    const m3 = sale(m2.remain, n("sale_m_A3"));

    /* ---- Female sale slabs ---- */
    const f1 = sale(saleBaseFemale, n("sale_f_A1"));
    const f2 = sale(f1.remain, n("sale_f_A2"));
    const f3 = sale(f2.remain, n("sale_f_A3"));

    /* ---- Retain for next year ---- */
    breedingMale = m3.remain;        // 🔁 rotate male
    breedingFemale += f3.remain;     // 🔁 accumulate female

    yearly.push({
      year,
      maleSold:{A1:m1.sold,A2:m2.sold,A3:m3.sold},
      femaleSold:{A1:f1.sold,A2:f2.sold,A3:f3.sold},
      breeding:{
        male: breedingMale,
        female: breedingFemale
      }
    });
  }

  localStorage.setItem(
    "BREEDING_PRODUCTION_AUTO",
    JSON.stringify(yearly)
  );

  renderResult(yearly);
}

/* ================= RENDER ================= */
function renderResult(data){

  let html = `
  <table>
  <tr>
    <th rowspan="2">वर्ष</th>
    <th colspan="4">भाले</th>
    <th colspan="4">पोथी</th>
  </tr>
  <tr>
    <th>१–३</th><th>४–६</th><th>७–१०</th><th>प्रजनन्का लागि</th>
    <th>१–३</th><th>४–६</th><th>७–१०</th><th>प्रजननयोग्य माउ</th>
  </tr>
  `;

  data.forEach(y=>{
    html += `
    <tr>
      <td>${y.year}</td>
      <td>${y.maleSold.A1}</td>
      <td>${y.maleSold.A2}</td>
      <td>${y.maleSold.A3}</td>
      <td><strong>${y.breeding.male}</strong></td>

      <td>${y.femaleSold.A1}</td>
      <td>${y.femaleSold.A2}</td>
      <td>${y.femaleSold.A3}</td>
      <td><strong>${y.breeding.female}</strong></td>
    </tr>`;
  });

  html += `</table>`;
  document.getElementById("result").innerHTML = html;
}
</script>

</body>
</html>

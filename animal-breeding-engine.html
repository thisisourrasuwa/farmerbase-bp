<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Animal Breeding Engine – Basic & Final</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; margin-bottom: 30px; }
    th, td { border: 1px solid #999; padding: 6px; text-align: center; }
    th { background: #f0f0f0; }
    h2 { margin-top: 40px; }
    pre { background: #111; color: #0f0; padding: 10px; overflow-x: auto; }
  </style>
</head>
<body>

<h1>🐄 Animal Breeding Engine (Basic – Stable)</h1>

<div id="output"></div>

<script>
/* =========================
   1. CONFIG (ONLY INPUT)
========================= */
const breedingConfig = {
  animal: "Pig",
  years: 5,

  cohorts: ["piglet", "grower", "adult"],

  initialStock: {
    piglet: { male: 0, female: 0 },
    grower: { male: 0, female: 0 },
    adult:  { male: 5, female: 20 }
  },

  reproduction: {
    adult: {
      birthPerFemalePerYear: 10,
      maleRatio: 50,
      femaleRatio: 50
    }
  },

  // ✅ SALES AGE % + GENDER %
  salesPolicy: {
    piglet: {
      male:   { sell: 0, retain: 100 },
      female: { sell: 0, retain: 100 }
    },
    grower: {
      male:   { sell: 50, retain: 50 },
      female: { sell: 30, retain: 70 }
    },
    adult: {
      male:   { sell: 80, retain: 20 },
      female: { sell: 60, retain: 40 }
    }
  }
};

/* =========================
   2. VALIDATION
========================= */
function validateSalesPolicy(policy) {
  for (let c in policy) {
    ["male", "female"].forEach(g => {
      if (policy[c][g].sell + policy[c][g].retain !== 100) {
        throw new Error(`Invalid sales policy: ${c} ${g}`);
      }
    });
  }
}

/* =========================
   3. ENGINE
========================= */
function runBreedingEngine(config) {

  validateSalesPolicy(config.salesPolicy);

  let stock = JSON.parse(JSON.stringify(config.initialStock));
  let results = [];

  for (let year = 1; year <= config.years; year++) {

    let yearData = {
      year,
      beforeSale: JSON.parse(JSON.stringify(stock)),
      sold: {},
      afterSale: {}
    };

    /* ---- Birth ---- */
    const adultFemales = stock.adult.female;
    const births = adultFemales * config.reproduction.adult.birthPerFemalePerYear;

    const maleBirths = births * (config.reproduction.adult.maleRatio / 100);
    const femaleBirths = births * (config.reproduction.adult.femaleRatio / 100);

    /* ---- Aging ---- */
    let nextStock = {
      piglet: { male: maleBirths, female: femaleBirths },
      grower: { ...stock.piglet },
      adult: {
        male: stock.grower.male + stock.adult.male,
        female: stock.grower.female + stock.adult.female
      }
    };

    /* ---- Sales (Age % + Gender %) ---- */
    for (let c in nextStock) {
      yearData.sold[c] = { male: 0, female: 0 };

      ["male", "female"].forEach(g => {
        const total = nextStock[c][g];
        const sellPct = config.salesPolicy[c][g].sell / 100;
        const soldQty = total * sellPct;

        yearData.sold[c][g] = soldQty;
        nextStock[c][g] = total - soldQty;
      });
    }

    yearData.afterSale = JSON.parse(JSON.stringify(nextStock));
    results.push(yearData);
    stock = nextStock;
  }

  return results;
}

/* =========================
   4. RUN & DISPLAY
========================= */
const data = runBreedingEngine(breedingConfig);
const output = document.getElementById("output");

data.forEach(y => {
  output.innerHTML += `<h2>Year ${y.year}</h2>`;

  let table = `<table>
    <tr>
      <th>Cohort</th>
      <th>Male (Remain)</th>
      <th>Female (Remain)</th>
      <th>Male Sold</th>
      <th>Female Sold</th>
    </tr>`;

  for (let c in y.afterSale) {
    table += `
      <tr>
        <td>${c}</td>
        <td>${y.afterSale[c].male.toFixed(1)}</td>
        <td>${y.afterSale[c].female.toFixed(1)}</td>
        <td>${y.sold[c].male.toFixed(1)}</td>
        <td>${y.sold[c].female.toFixed(1)}</td>
      </tr>`;
  }

  table += `</table>`;
  output.innerHTML += table;
});

output.innerHTML += `<h2>🔍 Raw JSON (Debug)</h2><pre>${JSON.stringify(data, null, 2)}</pre>`;
</script>

</body>
</html>

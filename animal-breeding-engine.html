<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>बंगुर पालन तथा प्रजनन (५ वर्षे)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:"Noto Sans Devanagari","Kalimati",system-ui;
  background:#f4f7f6;margin:0
}
.container{max-width:1250px;margin:auto;padding:20px}
h1,h2{color:#2c7a7b}
.card{
  background:#fff;padding:15px;margin-bottom:20px;
  border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.08)
}
label{font-weight:600}
input,button{
  width:100%;padding:8px;margin:6px 0 12px
}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{border:1px solid #ccc;padding:6px;text-align:right}
th{background:#e6fffa}
.flex{display:flex;gap:10px}
.flex>div{flex:1}
</style>
</head>

<body>
<div class="container">

<h1>🐖 बंगुर पालन तथा प्रजनन – ५ वर्षे प्रक्षेपण</h1>

<div class="card">
<h2>आधारभूत विवरण</h2>

<label>सुरुका बयस्क माउ संख्या</label>
<input type="number" id="adultFemale" value="200">

<label>व्याउने दर (%)</label>
<input type="number" id="breedingRate" value="90">

<label>प्रति माउ वार्षिक बच्चा</label>
<input type="number" id="birthPerFemale" value="20">

<label>बच्चा मृत्युदर (%)</label>
<input type="number" id="mortality" value="10">
</div>

<div class="card">
<h2>वर्ष अनुसार माउ बिक्री (%)</h2>
<div class="flex">
<div><label>वर्ष १</label><input type="number" id="a1" value="5"></div>
<div><label>वर्ष २</label><input type="number" id="a2" value="7"></div>
</div>
<div class="flex">
<div><label>वर्ष ३</label><input type="number" id="a3" value="10"></div>
<div><label>वर्ष ४</label><input type="number" id="a4" value="10"></div>
</div>
<div class="flex">
<div><label>वर्ष ५</label><input type="number" id="a5" value="12"></div>
</div>
</div>

<div class="card">
<h2>बच्चा बिक्री नीति</h2>

<label>उमेर अनुसार कुल बच्चा बिक्री (%)</label>
<input type="number" id="kidSellRate" value="50">

<label>भालेमध्ये प्रजननका लागि राखिने (%)</label>
<input type="number" id="boarKeepRate" value="5">

<label>पोथी बच्चामध्ये बिक्री (%)</label>
<input type="number" id="femaleKidSellRate" value="10">
</div>

<button onclick="calculate()">५ वर्षे गणना गर्नुहोस्</button>

<div class="card">
<h2>५ वर्ष प्रजनन प्रक्षेपण</h2>
<table>
<thead>
<tr>
<th>वर्ष</th>
<th>बयस्क माउ</th>
<th>जन्म</th>
<th>बच्चा बिक्री</th>
<th>भाले बिक्री</th>
<th>पोथी बिक्री</th>
<th>प्रजनन भाले</th>
<th>बाँकी पोथी</th>
<th>अर्का वर्ष माउ</th>
</tr>
</thead>
<tbody id="result"></tbody>
</table>
</div>

</div>

<script>
function calculate(){
 let adult = +adultFemale.value;

 const breedRate = breedingRate.value/100;
 const birthRate = +birthPerFemale.value;
 const mort = mortality.value/100;

 const adultSellRates=[
  a1.value,a2.value,a3.value,a4.value,a5.value
 ].map(v=>+v/100);

 const kidSell = +kidSellRate.value/100;
 const boarKeep = +boarKeepRate.value/100;
 const femaleKidSell = +femaleKidSellRate.value/100;

 result.innerHTML="";

 for(let y=1;y<=5;y++){

  // Adult female sale
  const soldAdult = adult * adultSellRates[y-1];
  const remainingAdult = adult - soldAdult;

  // Breeding & birth
  const bred = remainingAdult * breedRate;
  const birth = bred * birthRate;
  const death = birth * mort;
  const aliveKids = birth - death;

  // Kid sale (total)
  const soldKids = aliveKids * kidSell;
  const remainingKids = aliveKids - soldKids;

  // Sex ratio
  const maleKids = remainingKids / 2;
  const femaleKids = remainingKids / 2;

  // Male logic
  const breedingBoar = maleKids * boarKeep;
  const soldMale = maleKids - breedingBoar;

  // Female logic
  const soldFemale = femaleKids * femaleKidSell;
  const remainingFemale = femaleKids - soldFemale;

  // Next year adult female
  const nextAdult = remainingAdult + remainingFemale;

  result.innerHTML+=`
  <tr>
   <td>${y}</td>
   <td>${adult.toFixed(0)}</td>
   <td>${birth.toFixed(0)}</td>
   <td>${soldKids.toFixed(0)}</td>
   <td>${soldMale.toFixed(0)}</td>
   <td>${soldFemale.toFixed(0)}</td>
   <td>${breedingBoar.toFixed(0)}</td>
   <td>${remainingFemale.toFixed(0)}</td>
   <td>${nextAdult.toFixed(0)}</td>
  </tr>`;

  adult = nextAdult;
 }
}
calculate();
</script>

</body>
</html>

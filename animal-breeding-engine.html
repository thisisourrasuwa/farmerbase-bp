<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Animal Breeding Engine – Age Group Wise</title>
<style>
body{font-family:Arial;background:#f4f6f8;padding:20px}
table{width:100%;border-collapse:collapse;margin-top:15px;background:#fff}
th,td{border:1px solid #ccc;padding:6px;text-align:center}
th{background:#eaeff5}
input{width:70px}
h1,h2{text-align:center}
.section{background:#fff;padding:15px;border-radius:6px}
</style>
</head>
<body>

<h1>🐖🐐 Animal Breeding Engine</h1>
<h2>उमेर समूहगत भाले–पोथी (५ वर्ष)</h2>

<div class="section">
<table>
<tr><th>Input</th><th>Value</th></tr>
<tr><td>Male Born / Year</td><td><input id="maleBorn" value="10"></td></tr>
<tr><td>Female Born / Year</td><td><input id="femaleBorn" value="20"></td></tr>
<tr><td>Chick Sale % (M)</td><td><input id="chickSaleMale" value="40"></td></tr>
<tr><td>Grower Sale % (M)</td><td><input id="growerSaleMale" value="30"></td></tr>
<tr><td>Chick Sale % (F)</td><td><input id="chickSaleFemale" value="20"></td></tr>
<tr><td>Grower Sale % (F)</td><td><input id="growerSaleFemale" value="10"></td></tr>
</table>

<br>
<button onclick="calculate()">📊 Calculate</button>
</div>

<table id="result" style="display:none">
<thead>
<tr>
<th>Year</th>
<th>M Chick</th><th>M Grower</th><th>M Adult</th>
<th>F Chick</th><th>F Grower</th><th>F Adult</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
function r(n){return Math.round(n)}

function calculate(){

let maleChick=0, maleGrower=0, maleAdult=0;
let femaleChick=0, femaleGrower=0, femaleAdult=0;

const maleBorn = +maleBornInput.value;
const femaleBorn = +femaleBornInput.value;

const cSM = +chickSaleMale.value;
const gSM = +growerSaleMale.value;
const cSF = +chickSaleFemale.value;
const gSF = +growerSaleFemale.value;

const tbody = document.querySelector("#result tbody");
tbody.innerHTML = "";

for(let y=1;y<=5;y++){

  // Birth
  maleChick += maleBorn;
  femaleChick += femaleBorn;

  // Chick sale
  maleChick -= r(maleChick*cSM/100);
  femaleChick -= r(femaleChick*cSF/100);

  // Chick → Grower
  maleGrower += maleChick; maleChick=0;
  femaleGrower += femaleChick; femaleChick=0;

  // Grower sale
  maleGrower -= r(maleGrower*gSM/100);
  femaleGrower -= r(femaleGrower*gSF/100);

  // Grower → Adult
  maleAdult += maleGrower; maleGrower=0;
  femaleAdult += femaleGrower; femaleGrower=0;

  tbody.innerHTML += `
  <tr>
    <td>${y}</td>
    <td>${maleChick}</td><td>${maleGrower}</td><td>${maleAdult}</td>
    <td>${femaleChick}</td><td>${femaleGrower}</td><td>${femaleAdult}</td>
  </tr>`;
}

document.getElementById("result").style.display="table";
}
</script>

</body>
</html>

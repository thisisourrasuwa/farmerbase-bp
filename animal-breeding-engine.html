<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Animal Breeding Engine – FINAL</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:"Noto Sans Devanagari","Kalimati",system-ui;background:#f4f7f6;margin:0}
.container{max-width:1600px;margin:20px auto;background:#fff;padding:24px;border-radius:12px}
h1,h2{color:#2e7d32;margin-top:0}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}
input{width:60px}
button{padding:10px 20px;background:#2e7d32;color:#fff;border:none;border-radius:6px;cursor:pointer}
.group{background:#f1f8e9;font-weight:bold}
.note{font-size:13px;background:#f9fff6;border:1px dashed #9ccc65;padding:10px;margin-top:12px}

/* PAGE FOLLOW */
.page-follow-vertical{
  position:fixed;
  right:12px;
  top:40%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  z-index:999;
  transition:top .3s ease;
}
.pf-arrow{
  text-decoration:none;
  font-size:22px;
  background:#2e7d32;
  color:#fff;
  width:42px;height:42px;
  display:flex;align-items:center;justify-content:center;
  border-radius:50%;
}
.pf-label{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-size:13px;
  color:#2e7d32;
  background:#eef5ee;
  padding:6px 4px;
  border-radius:6px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="container">

<h1>🐷 Animal Breeding Engine</h1>
<p class="note">
✔️ उमेर समूहगत बिक्री नियम<br>
✔️ ५ वर्षे नतिजा = उमेर समूह अनुसार संख्या<br>
✔️ 100% sale ⇒ 0 retained (guaranteed)
</p>

<h2>🔢 प्रारम्भिक इनपुट</h2>
<table>
<tr><td>प्रारम्भिक माउ</td><td><input id="openingFemale" value="100"></td></tr>
<tr><td>एक माउले वार्षिक जन्माउने बच्चा</td><td><input id="kidsPerFemale" value="20"></td></tr>
<tr><td>व्याउने दर (%)</td><td><input id="breedRate" value="90"></td></tr>
<tr><td>मृत्युदर (%)</td><td><input id="deathRate" value="10"></td></tr>
</table>

<!-- (SALE RULE TABLE unchanged – as you provided) -->
<!-- … तपाईंले दिएको SALE RULE table जस्ताको तस्तै … -->

<br>
<button onclick="runEngine()">⚙️ Run Breeding Engine (5 Years)</button>

<hr>
<h2>📊 ५ वर्षे नतिजा (संख्या – उमेर समूहगत)</h2>
<div id="result"></div>

</div>

<!-- PAGE FOLLOW -->
<div class="page-follow-vertical" id="pageFollow">
  <a href="business-detail.html" class="pf-arrow">⬅️</a>
  <div class="pf-label">Breeding</div>
  <a href="feed-vitamin-medicine-5yr.html" class="pf-arrow">➡️</a>
</div>

<script>
function n(id){return Number(document.getElementById(id).value)||0;}
function sale(total,p){
  p=Math.min(p,100);
  let s=Math.round(total*p/100);
  return{sold:s,remain:total-s};
}

function runEngine(){

  let female=n("openingFemale");
  let maleCarry=0;
  let out=[];

  for(let y=1;y<=5;y++){

    let born=female*n("kidsPerFemale")*(n("breedRate")/100);
    born*=(1-n("deathRate")/100);

    let mBorn=Math.round(born/2);
    let fBorn=Math.round(born/2);

    let mA1=sale(mBorn,n(`mA1Y${y}`));
    let mA2=sale(mA1.remain,n(`mA2Y${y}`));
    let mA3=sale(mA2.remain,n(`mA3Y${y}`));

    let fA1=sale(fBorn,n(`fA1Y${y}`));
    let fA2=sale(fA1.remain,n(`fA2Y${y}`));
    let fA3=sale(fA2.remain,n(`fA3Y${y}`));

    let adultMale=sale(maleCarry,n(`adultMY${y}`));
    let adultFemale=sale(female,n(`adultFY${y}`));

    /* 🔧 PATCHED LINE (MAIN FIX) */
    maleCarry = adultMale.remain + mA3.remain;
    female = adultFemale.remain + fA3.remain;

    out.push({
      year:y,
      m:{A1:mA1.sold,A2:mA2.sold,A3:mA3.sold,ret:maleCarry},
      f:{A1:fA1.sold,A2:fA2.sold,A3:fA3.sold,ret:fA3.remain},
      adult:{male:adultMale.sold,female:adultFemale.sold},
      next:{male:maleCarry,female:female}
    });
  }

  render(out);

  /* ✅ EXPORT (PATCH ONLY) */
  localStorage.setItem(
    "BREEDING_ENGINE_5YR_RESULT",
    JSON.stringify(out)
  );
}

function render(d){
  let h=`<table>
  <tr><th>समूह \\ वर्ष</th>${d.map(x=>`<th>${x.year}</th>`).join("")}</tr>
  <tr class="group"><td colspan="${d.length+1}">भाले</td></tr>
  <tr><td>१–३ बिक्री</td>${d.map(x=>`<td>${x.m.A1}</td>`).join("")}</tr>
  <tr><td>४–६ बिक्री</td>${d.map(x=>`<td>${x.m.A2}</td>`).join("")}</tr>
  <tr><td>७–१० बिक्री</td>${d.map(x=>`<td>${x.m.A3}</td>`).join("")}</tr>
  <tr><td>राखिएका भाले</td>${d.map(x=>`<td>${x.m.ret}</td>`).join("")}</tr>

  <tr class="group"><td colspan="${d.length+1}">पोथी</td></tr>
  <tr><td>१–३ बिक्री</td>${d.map(x=>`<td>${x.f.A1}</td>`).join("")}</tr>
  <tr><td>४–६ बिक्री</td>${d.map(x=>`<td>${x.f.A2}</td>`).join("")}</tr>
  <tr><td>७–१० बिक्री</td>${d.map(x=>`<td>${x.f.A3}</td>`).join("")}</tr>
  <tr><td>राखिएका पोथी</td>${d.map(x=>`<td>${x.f.ret}</td>`).join("")}</tr>

  <tr class="group"><td colspan="${d.length+1}">बयस्क</td></tr>
  <tr><td>माउ बिक्री</td>${d.map(x=>`<td>${x.adult.female}</td>`).join("")}</tr>
  <tr><td>भाले बिक्री</td>${d.map(x=>`<td>${x.adult.male}</td>`).join("")}</tr>
  <tr><td>अर्का वर्ष माउ</td>${d.map(x=>`<td>${x.next.female}</td>`).join("")}</tr>
  <tr><td>अर्का वर्ष भाले</td>${d.map(x=>`<td>${x.next.male}</td>`).join("")}</tr>
  </table>`;
  result.innerHTML=h;
}

/* PAGE FOLLOW SCROLL */
(function(){
  const pf=document.getElementById("pageFollow");
  window.addEventListener("scroll",()=>{
    const h=document.body.scrollHeight-window.innerHeight;
    const r=h>0?window.scrollY/h:0;
    pf.style.top=(20+r*(window.innerHeight-120))+"px";
  });
})();
</script>

</body>
</html>

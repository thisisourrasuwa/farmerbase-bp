<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Animal Breeding Engine</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
  font-family:"Noto Sans Devanagari","Kalimati",system-ui;
  background:#f4f7f6;
  margin:0;
}
.container{
  max-width:1500px;
  margin:20px auto;
  background:#fff;
  padding:24px;
  border-radius:12px;
}
h1,h2{color:#2e7d32;margin-top:0}
table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#eef5ee}
input{width:80px}
button{
  padding:10px 18px;
  background:#2e7d32;
  color:#fff;
  border:none;
  border-radius:6px;
  cursor:pointer;
}

/* PAGE FOLLOW */
.page-follow-vertical{
  position:fixed;
  right:12px;
  top:40%;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:10px;
  z-index:999;
  transition:top 0.3s ease;
}
.pf-arrow{
  text-decoration:none;
  font-size:22px;
  background:#2e7d32;
  color:#fff;
  width:42px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
}
.pf-label{
  writing-mode:vertical-rl;
  transform:rotate(180deg);
  font-size:13px;
  color:#2e7d32;
  background:#eef5ee;
  padding:6px 4px;
  border-radius:6px;
  font-weight:bold;
}
</style>
</head>

<body>
<div class="container">

<h1>🐖 Animal Breeding Engine (५ वर्ष)</h1>

<p>
✔️ उमेर समूह: १–३, ४–६, ७–१०, बयस्क<br>
✔️ भाले / पोथी छुट्टाछुट्टै<br>
✔️ ५ वर्षे परिणाम auto-generate
</p>

<h2>🔢 प्रारम्भिक संख्या (Year 1)</h2>

<table>
<tr>
  <th>समूह</th>
  <th>भाले</th>
  <th>पोथी</th>
</tr>
<tr>
  <td>१–३ महिना</td>
  <td><input id="A1_m" value="50"></td>
  <td><input id="A1_f" value="45"></td>
</tr>
<tr>
  <td>४–६ महिना</td>
  <td><input id="A2_m" value="30"></td>
  <td><input id="A2_f" value="25"></td>
</tr>
<tr>
  <td>७–१० महिना</td>
  <td><input id="A3_m" value="20"></td>
  <td><input id="A3_f" value="15"></td>
</tr>
<tr>
  <td>बयस्क</td>
  <td><input id="adult_m" value="10"></td>
  <td><input id="adult_f" value="40"></td>
</tr>
</table>

<br>
<button onclick="runEngine()">▶️ Run Breeding Engine</button>

<h2>📊 ५ वर्षे नतिजा</h2>
<div id="result"></div>

</div>

<!-- PAGE FOLLOW -->
<div class="page-follow-vertical" id="pageFollow">
  <a href="business-detail.html" class="pf-arrow" title="व्यवसाय विवरण">⬅️</a>
  <div class="pf-label">Breeding Engine</div>
  <a href="feed-vitamin-medicine-5yr.html" class="pf-arrow" title="Feed • Vitamin">➡️</a>
</div>

<script>
// ================= ENGINE =================
function runEngine(){

  let out = [];

  let male = {
    A1: +A1_m.value,
    A2: +A2_m.value,
    A3: +A3_m.value,
    adult: +adult_m.value
  };
  let female = {
    A1: +A1_f.value,
    A2: +A2_f.value,
    A3: +A3_f.value,
    adult: +adult_f.value
  };

  for(let y=1;y<=5;y++){

    out.push({
      year:y,
      male:{...male},
      female:{...female}
    });

    // SIMPLE SHIFT LOGIC (demo-safe)
    male.adult += male.A3;
    female.adult += female.A3;

    male.A3 = male.A2;
    female.A3 = female.A2;

    male.A2 = male.A1;
    female.A2 = female.A1;

    male.A1 = Math.round(female.adult * 0.4);
    female.A1 = Math.round(female.adult * 0.6);
  }

  render(out);

  // 🔥 FINAL EXPORT (MOST IMPORTANT)
  console.log("BREEDING FINAL RESULT =", out);
  localStorage.setItem(
    "BREEDING_ENGINE_5YR_RESULT",
    JSON.stringify(out)
  );
}

// ================= RENDER =================
function render(data){

  let html = `<table>
  <tr>
    <th rowspan="2">वर्ष</th>
    <th colspan="4">भाले</th>
    <th colspan="4">पोथी</th>
  </tr>
  <tr>
    <th>१–३</th><th>४–६</th><th>७–१०</th><th>बयस्क</th>
    <th>१–३</th><th>४–६</th><th>७–१०</th><th>बयस्क</th>
  </tr>`;

  data.forEach(d=>{
    html+=`<tr>
      <td>${d.year}</td>
      <td>${d.male.A1}</td>
      <td>${d.male.A2}</td>
      <td>${d.male.A3}</td>
      <td>${d.male.adult}</td>
      <td>${d.female.A1}</td>
      <td>${d.female.A2}</td>
      <td>${d.female.A3}</td>
      <td>${d.female.adult}</td>
    </tr>`;
  });

  html+=`</table>`;
  document.getElementById("result").innerHTML = html;
}

// ================= PAGE FOLLOW SCROLL =================
(function(){
  const pf = document.getElementById("pageFollow");
  window.addEventListener("scroll", ()=>{
    const h = document.body.scrollHeight - window.innerHeight;
    const r = h>0 ? window.scrollY/h : 0;
    pf.style.top = (20 + r*(window.innerHeight-120)) + "px";
  });
})();
</script>

</body>
</html>

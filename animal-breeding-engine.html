<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Animal Breeding Engine – Final (3 Table Model)</title>
<style>
 body{font-family:Arial;padding:20px}
 table{border-collapse:collapse;width:100%;margin:15px 0}
 th,td{border:1px solid #999;padding:6px;text-align:center}
 th{background:#f0f0f0}
 h2{margin-top:30px}
 .note{background:#eef;padding:10px}
</style>
</head>
<body>

<h1>🐖 Animal Breeding Engine – FINAL</h1>

<div class="note">
✔️ Birth / Sale / Next-Year Breeding छुट्टाछुट्टै  
✔️ भाले–पोथी अलग  
✔️ Year-wise default policy  
✔️ Male : Female cap = 1 : 10  
</div>

<script>
// =======================
// BASIC INPUTS
// =======================
const YEARS = 5;
const MALE_RATIO = 10;

// Start
let breedingFemale = 100;
let breedingMale   = 10;

// Biology
const BIRTH_RATE = 0.9;
const BIRTH_PER_FEMALE = 20;
const DEATH_RATE = 0.1;

// Default Year-wise Sale Policy
const SALE_POLICY = {
  1:{gM:.70,gF:.60,aM:.30,aF:.05},
  2:{gM:.70,gF:.60,aM:.30,aF:.05},
  3:{gM:.60,gF:.50,aM:.20,aF:.05},
  4:{gM:.50,gF:.40,aM:.10,aF:.00},
  5:{gM:.40,gF:.30,aM:.05,aF:.00}
};

// Age buckets
let pigletF=0,pigletM=0,growerF=0,growerM=0;

// HTML containers
let birthTable = `<table><tr>
<th>वर्ष</th><th>Piglet F</th><th>Piglet M</th>
<th>Grower F</th><th>Grower M</th>
<th>Adult F</th><th>Adult M</th></tr>`;

let saleTable = `<table><tr>
<th>वर्ष</th><th>Grower F Sale</th><th>Grower M Sale</th>
<th>Adult F Sale</th><th>Adult M Sale</th></tr>`;

let carryTable = `<table><tr>
<th>वर्ष</th><th>Next Breeding Female</th>
<th>Next Breeding Male</th></tr>`;

// =======================
// YEAR LOOP
// =======================
for(let y=1;y<=YEARS;y++){

  // ---------- BIRTH ----------
  let effectiveFemale = breedingFemale * BIRTH_RATE;
  let totalBirth = effectiveFemale * BIRTH_PER_FEMALE;
  let bornF = totalBirth * .5 * (1-DEATH_RATE);
  let bornM = totalBirth * .5 * (1-DEATH_RATE);

  // ---------- AGING ----------
  let newAdultF = growerF;
  let newAdultM = growerM;

  growerF = pigletF;
  growerM = pigletM;

  pigletF = bornF;
  pigletM = bornM;

  let adultF = breedingFemale + newAdultF;
  let adultM = breedingMale   + newAdultM;

  // ---------- RECORD BIRTH TABLE ----------
  birthTable += `<tr>
  <td>${y}</td>
  <td>${pigletF.toFixed(0)}</td>
  <td>${pigletM.toFixed(0)}</td>
  <td>${growerF.toFixed(0)}</td>
  <td>${growerM.toFixed(0)}</td>
  <td>${adultF.toFixed(0)}</td>
  <td>${adultM.toFixed(0)}</td></tr>`;

  // ---------- SALE ----------
  let p = SALE_POLICY[y];

  let saleGF = growerF * p.gF;
  let saleGM = growerM * p.gM;
  let saleAF = adultF  * p.aF;
  let saleAM = adultM  * p.aM;

  growerF -= saleGF;
  growerM -= saleGM;
  adultF  -= saleAF;
  adultM  -= saleAM;

  saleTable += `<tr>
  <td>${y}</td>
  <td>${saleGF.toFixed(0)}</td>
  <td>${saleGM.toFixed(0)}</td>
  <td>${saleAF.toFixed(0)}</td>
  <td>${saleAM.toFixed(0)}</td></tr>`;

  // ---------- MALE CAP ----------
  let allowedMale = adultF / MALE_RATIO;
  if(adultM > allowedMale){
    adultM = allowedMale; // excess male auto-sale
  }

  // ---------- NEXT YEAR BREEDING ----------
  breedingFemale = adultF;
  breedingMale   = adultM;

  carryTable += `<tr>
  <td>${y}</td>
  <td>${breedingFemale.toFixed(0)}</td>
  <td>${breedingMale.toFixed(0)}</td></tr>`;
}

// Close tables
birthTable += "</table>";
saleTable  += "</table>";
carryTable += "</table>";

// Render
document.body.innerHTML += "<h2>🟩 Birth & Growth Table</h2>"+birthTable;
document.body.innerHTML += "<h2>🟥 Sale Decision Table</h2>"+saleTable;
document.body.innerHTML += "<h2>🟦 Next-Year Breeding Table</h2>"+carryTable;
</script>

</body>
</html>

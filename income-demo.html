<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Income & Selling Price</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
 font-family:"Noto Sans Devanagari","Kalimati",system-ui;
 background:#f4f7f6;margin:0
}
.container{
 max-width:1600px;margin:20px auto;
 background:#fff;padding:24px;border-radius:12px
}
h1,h2{color:#2e7d32;margin-top:0}

table{width:100%;border-collapse:collapse;margin-top:14px}
th,td{
 border:1px solid #ccc;
 padding:8px;
 text-align:center
}
th{background:#eef5ee}

input{width:70px;padding:6px}
.lock{background:#f1f8e9;font-weight:600}

.note{
 font-size:13px;background:#f9fff6;
 border:1px dashed #9ccc65;
 padding:10px;margin:12px 0
}

/* page flow */
.page-follow{
 position:fixed;right:14px;top:50%;
 transform:translateY(-50%);
 display:flex;flex-direction:column;gap:12px;z-index:999
}
.pf-btn{
 width:46px;height:46px;border-radius:50%;
 background:#2e7d32;color:#fff;
 display:flex;align-items:center;justify-content:center;
 text-decoration:none;font-size:22px
}
</style>
</head>

<body>

<div class="container">
<h1>💰 Income & Selling Price</h1>

<div class="note">
✔️ उत्पादन = production page बाट auto<br>
✔️ लागत = expenses (चालु + ह्रासकट्टी मात्र)<br>
✔️ नाफा % राख्दा बिक्री मूल्य auto
</div>

<h2>📊 बिक्री तथा आम्दानी</h2>
<div id="incomeBlock"></div>

</div>

<div class="page-follow">
 <a href="production.html" class="pf-btn">⬅️</a>
 <a href="profit-loss.html" class="pf-btn">➡️</a>
</div>

<script>
// ================= LOAD DATA =================

// Products from production page
const products =
 JSON.parse(localStorage.getItem("PRODUCTION_LIST")) || [];

// Cost allocation from expenses
const costMap =
 JSON.parse(localStorage.getItem("PRODUCTION_COST_MAP")) || {};

// Profit state
let incomeState =
 JSON.parse(localStorage.getItem("INCOME_STATE")) || {};

// ================= RENDER =================
function render(){

 if(!products.length){
  incomeBlock.innerHTML="<p>Production data छैन</p>";
  return;
 }

 let html=`<table>
 <tr>
  <th>उत्पादन</th>
  <th>इकाई</th>
  <th>परिमाण</th>
  <th>कुल लागत</th>
  <th>लागत / इकाई</th>
  <th>नाफा %</th>
  <th>बिक्री दर</th>
  <th>कुल बिक्री</th>
  <th>नाफा</th>
 </tr>`;

 let grandSales=0, grandCost=0, grandProfit=0;

 products.forEach(p=>{
  const key=p.name;
  const qty=Number(p.quantity)||1;

  const costObj = costMap[key] || { totalCost:0 };
  const totalCost = Number(costObj.totalCost)||0;

  const costPerUnit = qty ? totalCost/qty : 0;

  if(!incomeState[key]) incomeState[key]={profitPct:10};
  const profitPct = Number(incomeState[key].profitPct)||0;

  const sellingRate = costPerUnit * (1 + profitPct/100);
  const sales = sellingRate * qty;
  const profit = sales - totalCost;

  grandSales+=sales;
  grandCost+=totalCost;
  grandProfit+=profit;

  html+=`
   <tr>
    <td>${key}</td>
    <td>${p.unit||""}</td>
    <td>${qty}</td>
    <td class="lock">${Math.round(totalCost)}</td>
    <td class="lock">${Math.round(costPerUnit)}</td>
    <td>
      <input type="number" value="${profitPct}"
       onchange="setProfit('${key}',this.value)">
    </td>
    <td class="lock">${Math.round(sellingRate)}</td>
    <td class="lock">${Math.round(sales)}</td>
    <td class="lock">${Math.round(profit)}</td>
   </tr>`;
 });

 html+=`
 <tr>
  <th colspan="7">कुल</th>
  <th class="lock">${Math.round(grandSales)}</th>
  <th class="lock">${Math.round(grandProfit)}</th>
 </tr>
 </table>`;

 incomeBlock.innerHTML=html;

 // save totals
 localStorage.setItem(
  "INCOME_SUMMARY",
  JSON.stringify({
    totalSales:grandSales,
    totalCost:grandCost,
    totalProfit:grandProfit
  })
 );
}

function setProfit(key,val){
 incomeState[key].profitPct=Number(val)||0;
 localStorage.setItem("INCOME_STATE",JSON.stringify(incomeState));
 render();
}

// ================= INIT =================
render();
</script>

</body>
</html>

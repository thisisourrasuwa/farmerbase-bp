<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>आम्दानी विवरण</title>

<style>
body{font-family:Arial;background:#f5f5f5;margin:0}
header,footer{
 background:#2e7d32;color:#fff;
 padding:12px 20px;
 display:flex;justify-content:space-between;align-items:center
}
header a,footer a{color:#fff;text-decoration:none;font-weight:bold}
.container{
 max-width:1200px;margin:auto;background:#fff;
 padding:20px;min-height:70vh
}
h1{text-align:center;color:#2e7d32;margin:15px 0 25px}
table{width:100%;border-collapse:collapse}
th,td{border:1px solid #ccc;padding:8px;text-align:center}
th{background:#e8f5e9}
input{width:100%;box-sizing:border-box}
.btn{padding:6px 12px;border:none;cursor:pointer}
.add{background:#2e7d32;color:#fff}
.del{background:#c62828;color:#fff}
.summary{
 background:#f1f8e9;padding:14px;margin-top:15px;font-size:16px
}
</style>
</head>

<body>

<header>
 <a href="production.html">⬅️ उत्पादन</a>
 <span>आम्दानी विवरण</span>
 <a href="expense-demo.html">खर्च ➡️</a>
</header>

<div class="container">

<h1>आम्दानी विवरण (Income)</h1>

<table>
<thead>
<tr>
 <th>उत्पादन / वस्तु</th>
 <th>परिमाण</th>
 <th>बिक्री दर</th>
 <th>कुल</th>
 <th>🗑️</th>
</tr>
</thead>
<tbody id="incomeBody"></tbody>
</table>

<button class="btn add" onclick="addRow()">➕ आम्दानी थप्नुहोस्</button>

<div class="summary">
 <b>कुल आम्दानी (Grand Total):</b>
 <span id="grandTotal">0.00</span>
</div>

</div>

<footer>
 <a href="production.html">⬅️ उत्पादन</a>
 <span>FarmerBase BP Engine – Income</span>
 <a href="expense-demo.html">खर्च ➡️</a>
</footer>

<script>
/* ================= LOAD ================= */
let incomes =
 JSON.parse(localStorage.getItem("incomes")) || [];

/* ================= SAVE ================= */
function save(){
 localStorage.setItem("incomes", JSON.stringify(incomes));
}

/* ================= CRUD ================= */
function addRow(){
 incomes.push({
  id:Date.now(),
  name:"",
  qty:0,
  rate:0
 });
 save(); render();
}

function update(id,field,val){
 const r=incomes.find(x=>x.id===id);
 r[field]=Number(val)||val;
 save(); render();
}

function removeRow(id){
 if(confirm("हटाउने हो ?")){
  incomes=incomes.filter(x=>x.id!==id);
  save(); render();
 }
}

/* ================= RENDER ================= */
function render(){
 const tb=document.getElementById("incomeBody");
 tb.innerHTML="";
 let total=0;

 incomes.forEach(r=>{
  const lineTotal =
   (Number(r.qty)||0) * (Number(r.rate)||0);
  total += lineTotal;

  tb.innerHTML+=`
<tr>
 <td><input value="${r.name}"
  onchange="update(${r.id},'name',this.value)"></td>
 <td><input type="number" value="${r.qty}"
  onchange="update(${r.id},'qty',this.value)"></td>
 <td><input type="number" value="${r.rate}"
  onchange="update(${r.id},'rate',this.value)"></td>
 <td>${lineTotal.toFixed(2)}</td>
 <td><button class="btn del"
  onclick="removeRow(${r.id})">🗑️</button></td>
</tr>`;
 });

 document.getElementById("grandTotal").innerText =
  total.toFixed(2);

 /* 🔥 CRITICAL: GLOBAL TOTAL INCOME */
 localStorage.setItem("totalIncome", total);

}

render();
</script>

</body>
</html>

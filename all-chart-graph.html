<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Advanced Charts, Matrix & Break-even</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6f7}

/* HEADER */
header{
 background:#2e7d32;color:#fff;
 padding:18px;text-align:center;
 font-size:24px;font-weight:700
}

/* SIDE NAV */
.side-nav{
 position:fixed;top:50%;transform:translateY(-50%);
 width:48px;height:48px;border-radius:50%;
 background:#2e7d32;color:#fff;
 font-size:26px;display:flex;
 align-items:center;justify-content:center;
 cursor:pointer;z-index:999
}
.side-nav.prev{left:15px}
.side-nav.next{right:15px}

/* CONTAINER */
.container{
 max-width:1200px;margin:auto;
 background:#fff;padding:30px 70px;
 min-height:70vh
}

h2{color:#2e7d32;margin-top:35px}

/* MATRIX TABLE */
table{
 width:100%;
 border-collapse:collapse;
 margin-top:15px
}
th,td{
 border:1px solid #ccc;
 padding:10px;
 text-align:center
}
th{background:#e8f5e9}
.pos{color:#2e7d32;font-weight:bold}
.neg{color:#c62828;font-weight:bold}

/* CHART BOX */
.box{
 border:1px solid #ddd;
 padding:20px;
 margin-top:25px
}

footer{
 background:#2e7d32;color:#fff;
 padding:14px;text-align:center;
 margin-top:40px
}
</style>
</head>

<body>

<div class="side-nav prev" onclick="location.href='executive-summary.html'">⬅</div>
<div class="side-nav next" onclick="location.href='full-proposal.html'">➡</div>

<header>
 📊 Scenario × Product Matrix & Break-even Analysis
</header>

<div class="container">

<!-- ================= SCENARIO × PRODUCT MATRIX ================= -->
<h2>📊 Scenario × Product Profit Matrix</h2>

<table id="matrixTable">
<thead>
<tr>
 <th>उत्पादन</th>
 <th>Conservative (5%)</th>
 <th>Base (10%)</th>
 <th>Optimistic (15%)</th>
</tr>
</thead>
<tbody></tbody>
</table>

<!-- ================= BREAK-EVEN ================= -->
<h2>📉 Break-even Chart</h2>

<div class="box">
 <canvas id="breakEvenChart"></canvas>
</div>

</div>

<footer>
 FarmerBase BP Engine – Advanced Financial Insight
</footer>

<script>
/* ================= LOAD DATA ================= */
const totalIncome = Number(localStorage.getItem("totalIncome")) || 0;
const totalExpense = Number(localStorage.getItem("totalExpense")) || 0;
const productions = JSON.parse(localStorage.getItem("productions")) || [];

/* ================= SCENARIO MATRIX ================= */
const scenarios = [
 {name:"Conservative", rate:5},
 {name:"Base", rate:10},
 {name:"Optimistic", rate:15}
];

const tbody = document.querySelector("#matrixTable tbody");
tbody.innerHTML = "";

productions.forEach(p=>{
 const qty = Number(p.quantity)||1;
 const rate = Number(p.sellingRate)||0;
 const baseRevenue = qty * rate;

 let row = `<tr><td>${p.name}</td>`;

 scenarios.forEach(s=>{
  const revenue = baseRevenue * (1 + s.rate/100);
  const costShare = totalExpense / (productions.length || 1);
  const profit = revenue - costShare;

  row += `
   <td class="${profit>=0?'pos':'neg'}">
    ${profit.toFixed(2)}
   </td>`;
 });

 row += "</tr>";
 tbody.innerHTML += row;
});

/* ================= BREAK-EVEN CHART ================= */
// Simple linear break-even approximation
const fixedCost = totalExpense * 0.6;
const variableCostRate = 0.4; // 40% of sales
const maxSales = totalIncome * 1.5;

const sales=[], profit=[];
for(let s=0;s<=10;s++){
 const x = (maxSales/10)*s;
 const y = x - (fixedCost + x*variableCostRate);
 sales.push(x.toFixed(0));
 profit.push(y);
}

new Chart(
 document.getElementById("breakEvenChart"),
 {
  type:"line",
  data:{
   labels:sales,
   datasets:[
    {
     label:"Profit / Loss",
     data:profit,
     borderColor:"#2e7d32",
     fill:false
    },
    {
     label:"Break-even Line",
     data:new Array(profit.length).fill(0),
     borderColor:"#c62828",
     borderDash:[5,5],
     fill:false
    }
   ]
  },
  options:{
   plugins:{
    title:{display:true,text:"Break-even Analysis"}
   },
   scales:{
    y:{title:{display:true,text:"Profit / Loss"}},
    x:{title:{display:true,text:"Sales"}}
   }
  }
 }
);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>All Charts, Graphs & Annex</title>

<!-- Chart.js CDN -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6f7}

/* ===== HEADER ===== */
header{
 background:#2e7d32;color:#fff;
 padding:18px;text-align:center;
 font-size:24px;font-weight:700
}

/* ===== SIDE PAGE FOLLOW ===== */
.side-nav{
 position:fixed;top:50%;transform:translateY(-50%);
 width:48px;height:48px;border-radius:50%;
 background:#2e7d32;color:#fff;
 font-size:26px;display:flex;
 align-items:center;justify-content:center;
 cursor:pointer;z-index:999
}
.side-nav.prev{left:15px}
.side-nav.next{right:15px}

/* ===== CONTAINER ===== */
.container{
 max-width:1200px;margin:auto;
 background:#fff;padding:30px 70px;
 min-height:70vh
}

h2{color:#2e7d32;margin-top:35px}

/* ===== TOGGLE BUTTONS ===== */
.toggle{
 margin:15px 0;
 display:flex;
 gap:10px;
 flex-wrap:wrap
}
.toggle button{
 padding:8px 14px;
 border:1px solid #2e7d32;
 background:#fff;
 color:#2e7d32;
 cursor:pointer;
 font-weight:bold
}
.toggle button.active{
 background:#2e7d32;
 color:#fff
}

/* ===== CHART BOX ===== */
.box{
 border:1px solid #ddd;
 padding:20px
}

footer{
 background:#2e7d32;color:#fff;
 padding:14px;text-align:center;
 margin-top:40px
}
</style>
</head>

<body>

<!-- ===== PAGE FOLLOW ===== -->
<div class="side-nav prev" onclick="location.href='executive-summary.html'">⬅</div>
<div class="side-nav next" onclick="location.href='full-proposal.html'">➡</div>

<header>
 📊 Interactive Charts (Year / Product / Expense)
</header>

<div class="container">

<h2>Financial Analysis View</h2>

<div class="toggle">
 <button id="yearBtn" class="active" onclick="showYearWise()">Year-wise</button>
 <button id="prodBtn" onclick="showProductWise()">Product-wise</button>
 <button id="expBtn" onclick="showExpenseWise()">Expense-wise</button>
</div>

<div class="box">
 <canvas id="mainChart"></canvas>
</div>

</div>

<footer>
 FarmerBase BP Engine – Interactive Charts
</footer>

<script>
/* ================= LOAD BASE DATA ================= */

// Income / Expense summary
const totalIncome =
 Number(localStorage.getItem("totalIncome")) || 0;
const totalExpense =
 Number(localStorage.getItem("totalExpense")) || 0;

// Production list
const productions =
 JSON.parse(localStorage.getItem("productions")) || [];

// Expenses list
const expenses =
 JSON.parse(localStorage.getItem("expenses")) || [];

/* ================= CHART INSTANCE ================= */
let chart;

/* ================= YEAR-WISE ================= */
function getYearWise(){
 let inc = totalIncome;
 let exp = totalExpense;
 const labels=[], data=[];
 for(let y=1;y<=5;y++){
  labels.push("Year "+y);
  data.push(inc - exp);
  inc*=1.1; exp*=1.1;
 }
 return {labels, data, title:"Year-wise Net Profit"};
}

/* ================= PRODUCT-WISE ================= */
function getProductWise(){
 const labels=[], data=[];
 productions.forEach(p=>{
  labels.push(p.name);
  const qty = Number(p.quantity)||1;
  const rate = Number(p.sellingRate)||0;
  data.push(qty * rate);
 });
 return {labels, data, title:"Product-wise Income"};
}

/* ================= EXPENSE-WISE ================= */
function getExpenseWise(){
 const map = {};
 expenses.forEach(e=>{
  const label = e.title || e.category || "Other";
  const amount = (Number(e.qty)||1) * (Number(e.rate)||0);
  map[label] = (map[label] || 0) + amount;
 });
 return {
  labels:Object.keys(map),
  data:Object.values(map),
  title:"Expense-wise Distribution"
 };
}

/* ================= RENDER ================= */
function renderChart(type, labels, data, title){
 if(chart) chart.destroy();
 chart = new Chart(
  document.getElementById("mainChart"),
  {
   type:type,
   data:{
    labels:labels,
    datasets:[{
     label:title,
     data:data,
     backgroundColor:[
      "#66bb6a","#42a5f5","#ffa726",
      "#ab47bc","#ef5350","#26a69a"
     ]
    }]
   },
   options:{
    plugins:{title:{display:true,text:title}},
    responsive:true
   }
  }
 );
}

/* ================= TOGGLE ACTIONS ================= */
function setActive(btn){
 ["yearBtn","prodBtn","expBtn"].forEach(id=>{
  document.getElementById(id).classList.remove("active");
 });
 document.getElementById(btn).classList.add("active");
}

function showYearWise(){
 setActive("yearBtn");
 const d = getYearWise();
 renderChart("bar", d.labels, d.data, d.title);
}

function showProductWise(){
 setActive("prodBtn");
 const d = getProductWise();
 renderChart("bar", d.labels, d.data, d.title);
}

function showExpenseWise(){
 setActive("expBtn");
 const d = getExpenseWise();
 renderChart("doughnut", d.labels, d.data, d.title);
}

/* ================= INIT ================= */
showYearWise();
</script>

</body>
</html>

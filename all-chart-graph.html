<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<title>Financial Dashboard – Charts & Ratios</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{font-family:Arial;margin:0;background:#f4f6f7}

/* HEADER */
header{
 background:#2e7d32;color:#fff;
 padding:18px;text-align:center;
 font-size:24px;font-weight:700
}

/* SIDE NAV */
.side-nav{
 position:fixed;top:50%;transform:translateY(-50%);
 width:48px;height:48px;border-radius:50%;
 background:#2e7d32;color:#fff;
 font-size:26px;display:flex;
 align-items:center;justify-content:center;
 cursor:pointer;z-index:999
}
.side-nav.prev{left:15px}
.side-nav.next{right:15px}

/* CONTAINER */
.container{
 max-width:1200px;margin:auto;
 background:#fff;padding:30px 70px;
 min-height:70vh
}

h2{color:#2e7d32;margin-top:35px}

/* KPI GRID */
.kpi-grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
 gap:20px;
 margin-top:20px
}
.kpi{
 border:1px solid #ddd;
 padding:18px;
 background:#fafafa
}
.kpi h4{margin:0 0 8px;color:#2e7d32}
.kpi .value{font-size:22px;font-weight:bold}

/* MATRIX */
table{
 width:100%;border-collapse:collapse;margin-top:15px
}
th,td{
 border:1px solid #ccc;padding:10px;text-align:center
}
th{background:#e8f5e9}
.pos{color:#2e7d32;font-weight:bold}
.neg{color:#c62828;font-weight:bold}

/* CHART */
.box{border:1px solid #ddd;padding:20px;margin-top:25px}

footer{
 background:#2e7d32;color:#fff;
 padding:14px;text-align:center;
 margin-top:40px
}
</style>
</head>

<body>

<div class="side-nav prev" onclick="location.href='executive-summary.html'">⬅</div>
<div class="side-nav next" onclick="location.href='full-proposal.html'">➡</div>

<header>
 📊 Financial Dashboard (Charts, Ratios & Viability)
</header>

<div class="container">

<!-- ================= KPI SECTION ================= -->
<h2>🔢 Key Financial Ratios</h2>

<div class="kpi-grid">
 <div class="kpi"><h4>IRR</h4><div class="value" id="irr">0%</div></div>
 <div class="kpi"><h4>NPV</h4><div class="value" id="npv">0</div></div>
 <div class="kpi"><h4>Cash Flow Adequacy</h4><div class="value" id="cfAdeq">0</div></div>
 <div class="kpi"><h4>Debt–Equity Ratio</h4><div class="value" id="deRatio">0</div></div>
 <div class="kpi"><h4>Interest Coverage</h4><div class="value" id="icr">0</div></div>
 <div class="kpi"><h4>Operating Margin</h4><div class="value" id="opMargin">0%</div></div>
 <div class="kpi"><h4>Profit Distribution Ratio</h4><div class="value" id="pdRatio">0%</div></div>
</div>

<!-- ================= BREAK-EVEN ================= -->
<h2>📉 Break-even Chart</h2>
<div class="box">
 <canvas id="breakEvenChart"></canvas>
</div>

</div>

<footer>
 FarmerBase BP Engine – Financial Viability Dashboard
</footer>

<script>
/* ================= LOAD BASE DATA ================= */
const totalIncome = Number(localStorage.getItem("totalIncome")) || 0;
const totalExpense = Number(localStorage.getItem("totalExpense")) || 0;
const netProfit = Number(localStorage.getItem("netProfit")) || 0;

const totalInvestment = Number(
 localStorage.getItem("totalCapital") ||
 localStorage.getItem("fixed_total_capital")
) || 0;

const interestExpense =
 Number(localStorage.getItem("annual_interest_cost")) || 0;

const profitDist =
 JSON.parse(localStorage.getItem("profitDistribution")) || [];

/* ================= IRR ================= */
function calcIRR(flows){
 let rate=0.1;
 for(let i=0;i<100;i++){
  let npv=0,dnpv=0;
  for(let t=0;t<flows.length;t++){
   npv+=flows[t]/Math.pow(1+rate,t);
   dnpv-=t*flows[t]/Math.pow(1+rate,t+1);
  }
  rate-=npv/dnpv;
 }
 return rate;
}
let irr=0;
if(totalInvestment>0 && netProfit>0){
 const flows=[-totalInvestment];
 for(let y=1;y<=5;y++) flows.push(netProfit);
 irr=calcIRR(flows)*100;
}

/* ================= NPV ================= */
const discount=0.1;
let npv=-totalInvestment;
for(let y=1;y<=5;y++){
 npv+=netProfit/Math.pow(1+discount,y);
}

/* ================= RATIOS ================= */
const cashFlowAdeq =
 totalExpense>0 ? netProfit/totalExpense : 0;

const debtEquity =
 totalInvestment>0 ? totalInvestment/(totalInvestment-netProfit||1) : 0;

const interestCoverage =
 interestExpense>0 ? (netProfit+interestExpense)/interestExpense : Infinity;

const operatingMargin =
 totalIncome>0 ? (netProfit/totalIncome)*100 : 0;

let distPct=0;
profitDist.forEach(p=>distPct+=Number(p.percent)||0);

/* ================= RENDER KPIs ================= */
document.getElementById("irr").innerText = irr.toFixed(2)+"%";
document.getElementById("npv").innerText = npv.toFixed(2);
document.getElementById("cfAdeq").innerText = cashFlowAdeq.toFixed(2);
document.getElementById("deRatio").innerText = debtEquity.toFixed(2);
document.getElementById("icr").innerText =
 interestCoverage===Infinity?"∞":interestCoverage.toFixed(2);
document.getElementById("opMargin").innerText =
 operatingMargin.toFixed(2)+"%";
document.getElementById("pdRatio").innerText =
 distPct.toFixed(2)+"%";

/* ================= BREAK-EVEN ================= */
const fixedCost = totalExpense*0.6;
const variableRate = 0.4;
const sales=[], profit=[];
for(let i=0;i<=10;i++){
 const s=(totalIncome*1.5/10)*i;
 sales.push(s.toFixed(0));
 profit.push(s-(fixedCost+s*variableRate));
}

new Chart(
 document.getElementById("breakEvenChart"),
 {
  type:"line",
  data:{
   labels:sales,
   datasets:[
    {label:"Profit/Loss",data:profit,borderColor:"#2e7d32",fill:false},
    {label:"Break-even",data:new Array(profit.length).fill(0),
     borderColor:"#c62828",borderDash:[5,5],fill:false}
   ]
  }
 }
);
</script>

</body>
</html>
